<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A bright, friendly baking club for young bakers: 1,008 meat-free recipes, a family bake planner, shopping lists, festivals, learning and a baking journal.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="alternate icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Cpath%20d%3D%22M10%2024h28l-4%2018H14z%22%20fill%3D%22%234D9DFF%22%20stroke%3D%22%232A2160%22%20stroke-width%3D%223%22%20stroke-linejoin%3D%22round%22/%3E%3Cpath%20d%3D%22M8%2024c0-9%207-15%2016-15s16%206%2016%2015z%22%20fill%3D%22%23FF4F7B%22%20stroke%3D%22%232A2160%22%20stroke-width%3D%223%22/%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%226%22%20r%3D%224%22%20fill%3D%22%23FF4F7B%22%20stroke%3D%22%232A2160%22%20stroke-width%3D%222.5%22/%3E%3Cpath%20d%3D%22M15%2018l2-2M24%2015l2%202M31%2019l2-2%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.5%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E">
<meta name="theme-color" content="#FFB627">
<title>Whisk &amp; Wonder</title>
<style>
@font-face{font-family:"Bagel Fat One";src:url("bagel-fat-one-latin-400-normal.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Nunito";src:url("nunito-latin-400-normal.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Nunito";src:url("nunito-latin-600-normal.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Nunito";src:url("nunito-latin-800-normal.woff2") format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"Nunito";src:url("nunito-latin-900-normal.woff2") format("woff2");font-weight:900;font-display:swap}
html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: chunky "cookie-cutter" sticker cards with thick ink outlines on a sprinkle-dotted buttercup ground; tabbed app, one column on phones */
:root{
  --bg:#FFF2BF; --bg-dot1:#FF4F7B; --bg-dot2:#21C6A0; --bg-dot3:#4D9DFF;
  --paper:#FFFFFF; --paper-2:#FFF8E1;
  --ink:#2A2160; --muted:#5E5790; --line:#2A2160; --shadow:#2A2160;
  --berry:#FF4F7B; --mango:#FFB627; --mint:#21C6A0; --sky:#4D9DFF; --lilac:#B69CFF;
  --berry-soft:#FFD6E1; --mint-soft:#CDF5EA; --sky-soft:#D7E8FF; --mango-soft:#FFE7B0;
  --on-accent:#2A2160;
  --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,-apple-system,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1740; --bg-dot1:#FF6B91; --bg-dot2:#3ED9B3; --bg-dot3:#7DB8FF;
  --paper:#2B2459; --paper-2:#342C68;
  --ink:#FFF3D6; --muted:#CFC7F2; --line:#FFF3D6; --shadow:#0C0926;
  --berry:#FF6B91; --mango:#FFC94D; --mint:#3ED9B3; --sky:#7DB8FF; --lilac:#C6B2FF;
  --berry-soft:#5A2848; --mint-soft:#1E4A4A; --sky-soft:#23386A; --mango-soft:#55431F;
  --on-accent:#1C1740; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1C1740; --bg-dot1:#FF6B91; --bg-dot2:#3ED9B3; --bg-dot3:#7DB8FF;
  --paper:#2B2459; --paper-2:#342C68;
  --ink:#FFF3D6; --muted:#CFC7F2; --line:#FFF3D6; --shadow:#0C0926;
  --berry:#FF6B91; --mango:#FFC94D; --mint:#3ED9B3; --sky:#7DB8FF; --lilac:#C6B2FF;
  --berry-soft:#5A2848; --mint-soft:#1E4A4A; --sky-soft:#23386A; --mango-soft:#55431F;
  --on-accent:#1C1740; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.55;
  background-image:
    radial-gradient(circle at 20px 30px, var(--bg-dot1) 2.5px, transparent 3.5px),
    radial-gradient(circle at 70px 80px, var(--bg-dot2) 2.5px, transparent 3.5px),
    radial-gradient(circle at 110px 20px, var(--bg-dot3) 2.5px, transparent 3.5px);
  background-size:140px 120px;
}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.1;text-wrap:balance;margin:0;letter-spacing:.5px}
h1{font-size:clamp(2.2rem,6vw,3.6rem)}
h2{font-size:clamp(1.6rem,4vw,2.3rem)}
h3{font-size:1.3rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px dashed var(--berry);outline-offset:3px}

/* Header + tabs */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:3px solid var(--line);margin-inline:-16px;padding:10px 16px}
.topin{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:1.5rem;white-space:nowrap}
.brand svg{width:36px;height:36px}
nav.tabs{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;padding:4px 2px 6px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:3px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 16px;font-weight:800;cursor:pointer;white-space:nowrap;box-shadow:0 3px 0 var(--shadow);transition:transform .12s}
.tab:hover{transform:translateY(-2px)}
.tab[aria-selected="true"]{background:var(--mango);color:var(--on-accent)}

/* Generic pieces */
.card{background:var(--paper);border:3px solid var(--line);border-radius:var(--r);box-shadow:5px 5px 0 var(--shadow);padding:20px}
.btn{display:inline-flex;align-items:center;gap:8px;border:3px solid var(--line);border-radius:14px;padding:9px 18px;font-weight:900;cursor:pointer;background:var(--paper);box-shadow:0 4px 0 var(--shadow);transition:transform .1s, box-shadow .1s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--shadow)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.btn.berry{background:var(--berry);color:var(--on-accent)}
.btn.mint{background:var(--mint);color:var(--on-accent)}
.btn.mango{background:var(--mango);color:var(--on-accent)}
.btn.sky{background:var(--sky);color:var(--on-accent)}
.btn.small{padding:5px 12px;font-size:.9rem;border-radius:11px}
.btn svg{width:20px;height:20px}
.chip{display:inline-block;border:2px solid var(--line);border-radius:999px;padding:1px 10px;font-size:.8rem;font-weight:800;background:var(--paper-2)}
.chip.easy{background:var(--mint-soft)} .chip.medium{background:var(--mango-soft)} .chip.challenge{background:var(--berry-soft)}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-weight:900;font-size:.78rem;color:var(--muted)}
.muted{color:var(--muted)}
.section{display:grid;gap:22px;padding-top:26px}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
label.f{display:grid;gap:4px;font-weight:800;font-size:.9rem}
input[type=text],input[type=date],select,textarea{border:3px solid var(--line);border-radius:12px;background:var(--paper-2);padding:8px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.flag{display:block;width:42px;height:28px;border:2px solid var(--line);border-radius:5px;flex:none}

/* Home */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;align-items:stretch}
.hero .card:first-child{background:var(--berry-soft);display:grid;gap:14px;align-content:center;position:relative;overflow:hidden}
.hero h1 span{color:var(--berry)}
.namebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.namebox input{max-width:220px}
.tipcard{background:var(--sky-soft);display:grid;gap:10px;align-content:start}
.tipcard .big{font-weight:800;font-size:1.1rem}
.tokens{display:flex;gap:12px;flex-wrap:wrap}
.token{width:66px;height:66px;border:3px dashed var(--line);border-radius:50%;display:grid;place-items:center;background:var(--paper-2)}
.token.on{border-style:solid;background:var(--mango)}
.token svg{width:40px;height:40px}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--display);font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-weight:800;color:var(--muted);font-size:.85rem}
.bar{height:16px;border:3px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper-2)}
.bar i{display:block;height:100%;background:var(--mint);transition:width .4s}

/* Passport */
.passport{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px}
.stamp{aspect-ratio:1;max-width:100%;border:3px dashed var(--muted);border-radius:50%;display:grid;place-items:center;text-align:center;padding:10px;font-weight:900;font-size:.82rem;color:var(--muted);opacity:.6}
.stamp .c{font-family:var(--display);font-size:1rem;line-height:1.05}
.stamp.on{opacity:1;border-style:double;border-width:6px;color:var(--berry);border-color:var(--berry);transform:rotate(-8deg);background:var(--paper)}
.stamp.on:nth-child(even){transform:rotate(7deg);color:var(--sky);border-color:var(--sky)}
.stamp.on:nth-child(3n){color:var(--mint);border-color:var(--mint);transform:rotate(-3deg)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{border:3px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:4px;background:var(--paper-2);opacity:.55}
.badge.on{opacity:1;background:var(--mango-soft)}
.badge b{font-family:var(--display);font-weight:400;font-size:1.05rem}
.badge small{color:var(--muted);font-weight:700;line-height:1.3}

/* Planner */
.weeknav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.weeknav .ctrl{display:flex;gap:8px;flex-wrap:wrap}
.sessions{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.session{display:grid;gap:12px;align-content:start}
.session .num{font-family:var(--display);font-size:1.1rem;display:flex;justify-content:space-between;align-items:center}
.session.done{background:var(--mint-soft)}
.session.done .num::after{content:"Baked!";font-family:var(--body);font-weight:900;font-size:.8rem;border:2px solid var(--line);border-radius:999px;padding:1px 10px;background:var(--mint);color:var(--on-accent)}
.shopbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.shopbtn{border:3px solid var(--line);border-radius:12px;padding:6px 14px;font-weight:900;cursor:pointer;background:var(--paper)}
.shopbtn[aria-pressed="true"]{background:var(--sky);color:var(--on-accent)}
.list{display:grid;gap:18px}
.aisle h3{font-size:1.05rem;margin-bottom:6px}
.item{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:12px;border:2px solid transparent;cursor:pointer}
.item:hover{border-color:var(--line);background:var(--paper-2)}
.item input{position:absolute;opacity:0;pointer-events:none}
.box{width:28px;height:28px;flex:none;border:3px solid var(--line);border-radius:8px;display:grid;place-items:center;background:var(--paper)}
.box svg{width:18px;height:18px;opacity:0;transform:scale(.4);transition:.2s}
.item.got .box{background:var(--mint)}
.item.got .box svg{opacity:1;transform:scale(1)}
.item.got .nm{text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:var(--berry);color:var(--muted)}
.item .nm{flex:1;font-weight:700;min-width:0}
.item .q{font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .for{display:block;font-size:.78rem;color:var(--muted);font-weight:600}
.storetip{background:var(--mango-soft);border:2px dashed var(--line);border-radius:14px;padding:10px 14px;font-weight:600}

/* Recipes */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.rcard{display:grid;gap:10px;cursor:pointer;text-align:left;transition:transform .15s}
.rcard:hover{transform:translateY(-4px) rotate(-.6deg)}
.rcard .meta{display:flex;gap:6px;flex-wrap:wrap}
.rcard .skill{font-weight:700;font-size:.92rem;color:var(--muted)}
.art{height:120px;border-radius:12px;border:3px solid var(--line);display:grid;place-items:center;overflow:hidden}
.art svg{height:110px;width:100%;max-width:200px}
.rcard:hover .art svg{transform:scale(1.06) rotate(-2deg);transition:transform .25s}
.rhead{display:flex;align-items:center;gap:10px}
.pipcorner{background:var(--sky-soft);display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:start}
.pipcorner .pipfig svg{width:96px;height:128px}
.pipfig{cursor:pointer;background:none;border:0;padding:0;display:block}
@keyframes bob{50%{transform:translateY(-6px) rotate(3deg)}}
.bubble{position:relative;background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:12px 14px;font-weight:800;font-size:1.05rem;line-height:1.4}
.bubble::before{content:"";position:absolute;left:-13px;top:22px;border:10px solid transparent;border-right-color:var(--line)}
.bubble::after{content:"";position:absolute;left:-8px;top:24px;border:8px solid transparent;border-right-color:var(--paper)}
.pipfact{grid-column:1/-1;display:grid;gap:4px}
.toast{display:flex;align-items:center;gap:10px}
.toast svg{width:34px;height:46px;flex:none}
.quiz{display:grid;gap:10px;background:var(--paper-2);border:3px solid var(--line);border-radius:16px;padding:14px}
.quiz .q{font-weight:900}
.quiz .opts{display:grid;gap:8px}
.opt{text-align:left;border:3px solid var(--line);border-radius:12px;background:var(--paper);padding:8px 12px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--shadow)}
.opt:hover{background:var(--mango-soft)}
.opt.wrong{background:var(--berry-soft);animation:shake .4s}
.opt.right{background:var(--mint);color:var(--on-accent)}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.quiz .fb{font-weight:800}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(20,15,50,.55);z-index:50;display:grid;place-items:start center;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px 24px;overflow-y:auto}
.modal{width:100%;max-width:760px;display:grid;gap:18px;background:var(--paper)}
.modal .head{display:flex;justify-content:space-between;gap:12px;align-items:start}
.cols{display:grid;grid-template-columns:1fr 1.5fr;gap:22px}
.cols>*{min-width:0}
ul.ing{list-style:none;padding:0;margin:0;display:grid;gap:6px}
ul.ing li{display:flex;justify-content:space-between;gap:10px;border-bottom:2px dotted var(--muted);padding-bottom:4px}
ul.ing li b{font-variant-numeric:tabular-nums;white-space:nowrap}
ol.steps{margin:0;padding:0;list-style:none;display:grid;gap:10px;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start}
ol.steps li::before{content:counter(s);font-family:var(--display);width:34px;height:34px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;background:var(--mango);color:var(--on-accent)}
.grownup{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em;background:var(--berry-soft);border:2px solid var(--berry);border-radius:999px;padding:0 8px;margin-left:4px;vertical-align:2px}
.grownup svg{width:14px;height:14px}
.note{background:var(--sky-soft);border-radius:14px;padding:12px 14px;font-weight:600}

/* School */
details.lesson{padding:0;overflow:hidden}
details.lesson summary{list-style:none;cursor:pointer;padding:16px 20px;display:flex;align-items:center;gap:14px}
details.lesson summary::-webkit-details-marker{display:none}
.lesson .ico{width:52px;height:52px;flex:none;border-radius:14px;border:3px solid var(--line);display:grid;place-items:center}
.lesson .ico svg{width:34px;height:34px}
.lesson .ttl{flex:1;min-width:0}
.lesson .ttl small{display:block;color:var(--muted);font-weight:700}
.lesson .done-mark{font-weight:900;font-size:.8rem;border:2px solid var(--line);border-radius:999px;padding:1px 10px;background:var(--mint);color:var(--on-accent)}
.lesson .body{padding:0 20px 20px;display:grid;gap:12px}
.lesson .body ul{margin:0;padding-left:20px;display:grid;gap:4px}
.tryit{background:var(--mango-soft);border:2px dashed var(--line);border-radius:14px;padding:10px 14px}
.fact{background:var(--lilac);color:var(--on-accent);border:3px solid var(--line);border-radius:var(--r);padding:16px 20px;font-weight:800;box-shadow:5px 5px 0 var(--shadow)}

/* Journal */
.jform{display:grid;gap:14px;background:var(--mango-soft)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.moods{display:flex;gap:10px;flex-wrap:wrap}
.mood{border:3px solid var(--line);border-radius:16px;background:var(--paper);padding:6px 10px;display:grid;justify-items:center;gap:2px;cursor:pointer;font-weight:800;font-size:.8rem;min-width:84px}
.mood svg{width:40px;height:40px}
.mood[aria-pressed="true"]{background:var(--mango);color:var(--on-accent);transform:rotate(-3deg)}
.starsin{display:flex;gap:4px}
.starsin button{background:none;border:none;padding:2px;cursor:pointer}
.starsin svg{width:34px;height:34px}
.entries{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.entry{display:grid;gap:10px;align-content:start;position:relative}
.entry:nth-child(3n+1){transform:rotate(-.7deg);background:var(--paper)}
.entry:nth-child(3n+2){transform:rotate(.6deg);background:var(--sky-soft)}
.entry:nth-child(3n){transform:rotate(-.3deg);background:var(--mint-soft)}
.entry .tape{position:absolute;top:-12px;left:50%;width:90px;height:22px;transform:translateX(-50%) rotate(-3deg);background:var(--mango);opacity:.85;border:2px solid var(--line)}
.entry .topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.entry .topline svg{width:46px;height:46px;flex:none}
.entry dl{margin:0;display:grid;gap:6px}
.entry dt{font-weight:900;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.entry dd{margin:0;font-weight:600}
.showstars svg{width:20px;height:20px}
.example-tag{font-weight:900;font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;background:var(--berry);color:var(--on-accent);border:2px solid var(--line);border-radius:999px;padding:0 8px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:800;padding:10px 20px;border-radius:999px;z-index:60;box-shadow:0 4px 0 var(--shadow);max-width:calc(100% - 32px);text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}
footer{padding-top:40px;color:var(--muted);font-weight:700;font-size:.85rem;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}

@media (max-width:760px){
  .pipcorner{grid-template-columns:72px 1fr}.pipcorner .pipfig svg{width:72px;height:96px}
  .hero,.cols{grid-template-columns:1fr}
  body{font-size:16px}
  .brand span{display:none}
}
/* ---------- Motion (switched off by the "Wiggles" toggle, which adds html.calm) ---------- */
@keyframes drift{to{background-position:280px 480px}}
@keyframes rise{from{transform:translateY(28px) scale(.96)}}
@keyframes pop{from{transform:scale(.2) rotate(-18deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
@keyframes float{50%{transform:translateY(-6px) rotate(1.5deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes wave{0%,55%,100%{transform:rotate(0)}65%,85%{transform:rotate(-30deg)}75%{transform:rotate(6deg)}}
@keyframes jump{30%{transform:translateY(-34px) rotate(-12deg)}60%{transform:translateY(0) rotate(8deg) scaleY(.88)}80%{transform:translateY(-6px)}}
@keyframes stampin{from{transform:scale(2.8) rotate(-40deg);opacity:0}}
@keyframes slap{from{transform:translateY(-50px) rotate(-10deg) scale(1.1)}}
@keyframes toastin{from{transform:translate(-50%,60px) scale(.7)}}
@keyframes stripes{to{background-position:28px 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes beckon{0%,100%{transform:none}50%{transform:scale(1.06) rotate(-1.5deg)}}
@keyframes glow{50%{opacity:.25}}
@keyframes stir{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(22deg)}}
html:not(.calm) body{animation:drift 70s linear infinite}
html:not(.calm) #view.enter .section>*{animation:rise .6s cubic-bezier(.2,1.4,.4,1) backwards;animation-delay:calc(var(--s,0)*80ms)}
html:not(.calm) #view.enter :is(.grid,.sessions,.entries,.badges,.passport)>*{animation:rise .6s cubic-bezier(.2,1.4,.4,1) backwards;animation-delay:calc(var(--n,0)*70ms + 150ms)}
h1 .ltr{display:inline-block}
html:not(.calm) #view.enter h1 .ltr{animation:pop .7s cubic-bezier(.2,1.7,.4,1) backwards;animation-delay:calc(var(--i)*35ms + 120ms)}
html:not(.calm) .pipfig{animation:float 3s ease-in-out infinite}
html:not(.calm) .pip-eyes{animation:blink 4.5s infinite;transform-origin:60px 64px}
html:not(.calm) .pip-arm{animation:wave 2.6s ease-in-out infinite;transform-origin:90px 86px}
html:not(.calm) .pipfig.jump svg{animation:jump .75s cubic-bezier(.3,1.5,.5,1)}
html:not(.calm) .bubble.say{animation:pop .45s cubic-bezier(.2,1.7,.4,1)}
html:not(.calm) .toast.show{animation:toastin .5s cubic-bezier(.2,1.5,.4,1)}
html:not(.calm) .token.on svg{animation:wiggle 2.4s ease-in-out infinite}
html:not(.calm) .token.on:nth-child(2) svg{animation-delay:.3s}
html:not(.calm) .token.on:nth-child(3) svg{animation-delay:.6s}
html:not(.calm) .rcard .art svg{animation:float 4s ease-in-out infinite;animation-delay:calc(var(--n,0)*-.6s)}
html:not(.calm) .rcard:hover{animation:wiggle .5s}
html:not(.calm) .item.justgot .box{animation:pop .5s cubic-bezier(.2,1.9,.4,1)}
html:not(.calm) .stamp.new{animation:stampin .8s cubic-bezier(.3,1.4,.5,1) .5s backwards}
html:not(.calm) .entry.slap{animation:slap .7s cubic-bezier(.3,1.5,.5,1) backwards}
html:not(.calm) .mood[aria-pressed="true"] svg{animation:pop .5s cubic-bezier(.2,1.8,.4,1)}
html:not(.calm) .starsin button.lit svg{animation:pop .45s cubic-bezier(.2,1.8,.4,1) backwards;animation-delay:calc(var(--i)*70ms)}
html:not(.calm) .badge.on svg{animation:spin 6s linear infinite}
html:not(.calm) .btn.beckon{animation:beckon 1.8s ease-in-out infinite}
.bar i{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 7px,transparent 7px 14px)}
html:not(.calm) .bar i{animation:stripes 1s linear infinite}
.motion-toggle{white-space:nowrap}
/* Bake-along */
.ba{position:fixed;inset:0;z-index:55;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.ba-in{max-width:760px;margin:0 auto;display:grid;gap:20px}
.ba-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.track{position:relative;height:22px;border:3px solid var(--line);border-radius:999px;background:var(--paper);margin:18px 22px 4px}
.track i{position:absolute;left:0;top:0;bottom:0;background:var(--berry);border-radius:999px;transition:width .5s}
.track svg{position:absolute;top:50%;width:46px;height:46px;transform:translate(-50%,-60%);transition:left .5s cubic-bezier(.3,1.4,.5,1)}
.stepcard{display:grid;gap:16px;font-size:clamp(1.15rem,3.4vw,1.45rem);font-weight:800;line-height:1.45}
.stepnum{font-family:var(--display);font-size:3rem;line-height:1;color:var(--berry)}
html:not(.calm) .stepcard.enter{animation:rise .5s cubic-bezier(.2,1.4,.4,1)}
.timer{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--mango-soft)}
.timer>*{min-width:0}
.timer .t{font-family:var(--display);font-size:2.8rem;line-height:1;font-variant-numeric:tabular-nums}
.timer .ctl{display:flex;gap:8px;flex-wrap:wrap}
.machine svg{width:150px;height:130px;max-width:100%}
html:not(.calm) .machine.on .glow{animation:glow 1.4s ease-in-out infinite}
html:not(.calm) .machine.on .whisk{animation:stir .8s ease-in-out infinite}
.machine .whisk{transform-origin:75px 30px}
.machine .cake{transform-origin:75px 96px;transition:transform 1s linear}
.ba-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.finish{text-align:center;justify-items:center}
.finish .pipfig svg{width:140px;height:186px}
html:not(.calm) .finish .pipfig svg{animation:jump 1.1s cubic-bezier(.3,1.5,.5,1) infinite}
@media (max-width:520px){.timer{grid-template-columns:1fr}.machine{justify-self:center}}

:root{--lilac-soft:#EDE4FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--lilac-soft:#3A2F6B}}

.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.small{font-size:.85rem}
.muted.small{font-weight:700}
.flag.globe{border:none;width:28px;height:28px;color:var(--muted)}
.art{position:relative}
.art.big{height:150px}
.inseason{position:absolute;top:8px;right:8px;background:var(--mint);color:var(--on-accent);border:2px solid var(--line);border-radius:999px;font-weight:900;font-size:.72rem;padding:0 8px}
.inseason.mine{left:8px;right:auto;background:var(--lilac)}
.diets{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.diet{font-size:.72rem;font-weight:900;border:2px solid var(--line);border-radius:6px;padding:0 6px;letter-spacing:.02em}
.diet.v{background:var(--mint-soft)} .diet.gf{background:var(--sky-soft)} .diet.ls{background:var(--mango-soft)} .diet.sv{background:var(--berry-soft)} .diet.nf{background:var(--paper-2)}
.chipbtn{border:2px solid var(--line);border-radius:999px;background:var(--paper);padding:3px 12px;font-weight:800;cursor:pointer;font-size:.85rem;box-shadow:0 2px 0 var(--shadow)}
.chipbtn:hover{background:var(--mango-soft)}
.filterbox{display:grid;gap:12px;background:var(--paper-2)}
.frow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.frow .shopbtn{padding:4px 12px;font-size:.88rem}
.f.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0;max-width:100%}
.f.inline select{width:auto;flex:1 1 160px;min-width:0;max-width:100%}
.filterbox,.filterbox>*{min-width:0;max-width:100%}
.word{display:inline-block;white-space:nowrap}
.tab{padding:6px 13px}
input[type=search],input[type=number],input[type=time]{border:3px solid var(--line);border-radius:12px;background:var(--paper-2);padding:8px 10px;width:100%;min-width:0}
.pickbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--mango);color:var(--on-accent);border:3px solid var(--line);border-radius:var(--r);padding:12px 16px;box-shadow:4px 4px 0 var(--shadow);position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);z-index:10}
.empty{text-align:center;font-weight:800}
.mini{display:flex;gap:10px;align-items:center;text-align:left;border:3px solid var(--line);border-radius:14px;background:var(--paper-2);padding:8px;cursor:pointer;width:100%}
.mini .art{width:76px;height:52px;flex:none;border-width:2px}
.mini .art svg{height:48px}
.mini b{display:block;line-height:1.2}
.mini small{color:var(--muted);font-weight:700}
.emptyslot{border:3px dashed var(--muted);border-radius:14px;padding:12px;display:grid;gap:8px;text-align:center;justify-items:center}
.emptyslot p{font-weight:800;color:var(--muted)}
.allergy{background:var(--berry-soft);border-radius:12px;padding:8px 12px;font-weight:700}
.scaler{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note ul{margin:6px 0 0;padding-left:20px;display:grid;gap:4px}
.confirm{display:inline-flex;gap:6px;align-items:center;font-weight:800;flex-wrap:wrap}
.festnext{border-top:10px solid var(--fc);display:grid;gap:10px;align-content:start}
.countdown{font-family:var(--display);font-size:1.6rem;color:var(--berry)}
.countdown small{font-family:var(--body);font-size:.9rem;color:var(--muted);font-weight:800;display:block}
.seasoncard{display:grid;gap:12px;background:var(--mint-soft)}
.produce{border:2px solid var(--line);border-radius:999px;background:var(--paper);padding:2px 12px;font-weight:800}
.festlist{display:grid;gap:16px}
.fest{display:grid;grid-template-columns:84px 1fr;gap:16px;align-items:start;border-left:10px solid var(--fc)}
.fest>*{min-width:0}
.fdate{display:grid;justify-items:center;border:3px solid var(--line);border-radius:14px;padding:6px;background:var(--paper-2);line-height:1.1}
.fdate b{font-family:var(--display);font-size:2rem;font-weight:400}
.fdate span{font-weight:900;text-transform:uppercase;letter-spacing:.08em}
.fdate small{font-weight:700;color:var(--muted)}
.fbody{display:grid;gap:8px}
.learncard{text-align:left;cursor:pointer;display:grid;gap:8px;background:var(--lc);transition:transform .15s}
.learncard:hover{transform:translateY(-4px) rotate(-.5deg)}
.lico{width:56px;height:56px;border:3px solid var(--line);border-radius:16px;background:var(--paper);display:grid;place-items:center}
.lico svg{width:34px;height:34px;color:var(--ink)}
.learncard p{font-weight:700}
.infocard{background:var(--lc);display:grid;gap:8px;align-content:start}
.infocard ul{margin:0;padding-left:20px;display:grid;gap:6px;font-weight:600}
.quizcard{display:grid;gap:14px}
.win{font-family:var(--display);font-size:1.3rem;color:var(--mint)}
.challenge{display:grid;gap:10px;background:var(--mango-soft)}
.mathcard{display:grid;gap:10px;align-content:start}
.mathcard.wide{grid-column:1/-1}
.mathcard .big{font-size:1.3rem}
.ratio{display:flex;gap:6px}
.ratio>div{border:3px solid var(--line);border-radius:12px;padding:8px;display:grid;text-align:center;min-width:0}
.ratio>div:nth-child(1){background:var(--berry-soft)} .ratio>div:nth-child(2){background:var(--mango-soft)} .ratio>div:nth-child(3){background:var(--sky-soft)}
.ratio span{font-size:.8rem;font-weight:800;color:var(--muted)}
.tablewrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{border-bottom:2px dotted var(--muted);padding:6px 8px;text-align:left}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.costtable input{border:2px solid var(--line);border-radius:8px;background:var(--paper-2);padding:4px 6px;width:100%;min-width:70px}
.costtable td:first-child input{min-width:130px}
td.num{font-weight:900;white-space:nowrap}
.profit{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.profit>div{border:3px solid var(--line);border-radius:12px;padding:10px;background:var(--paper-2);display:grid;gap:2px}
.profit span{font-size:.8rem;font-weight:800;color:var(--muted)}
.profit b{font-family:var(--display);font-weight:400;font-size:1.5rem;font-variant-numeric:tabular-nums}
.profit b.neg{color:var(--berry)}
.links{margin:0;padding-left:20px;display:grid;gap:6px;font-weight:700}
.links a{color:var(--ink);text-decoration-color:var(--berry);text-decoration-thickness:2px}
.jobcard{display:grid;gap:6px;align-content:start}
.jobcard p{font-weight:600}
.cvwrap{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}

.cvpaper{background:#FFFFFF;color:#2A2160;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px)}
.cvpaper h3{color:#2A2160}
.cvpaper pre{white-space:pre-wrap;font-family:var(--body);font-size:.92rem;margin:0;line-height:1.5;overflow-wrap:anywhere}
.tick{display:inline-flex;gap:6px;align-items:center;font-weight:700;border:2px solid var(--line);border-radius:10px;padding:3px 8px;background:var(--paper);cursor:pointer;font-size:.88rem}
.consent{background:var(--mango-soft);border:3px dashed var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;font-weight:600}
.micbtn.live{background:var(--berry);color:var(--on-accent)}

.entry .photos img{width:100%;height:auto;max-height:220px;aspect-ratio:4/3}
.entry .photos .mwrap{flex:1 1 140px}
.mwrap{position:relative;display:inline-block;max-width:100%}
.mwrap.missing{display:none}

audio{max-width:100%;height:40px}

.backup{display:grid;gap:10px;background:var(--sky-soft)}
.backup label.btn{cursor:pointer}
.edform{display:grid;gap:16px}
.edrows{display:grid;gap:8px}
.edrow{display:grid;grid-template-columns:2fr .8fr .8fr 1.2fr auto;gap:6px;align-items:center}
.edrow>*{min-width:0}
.edrow input,.edrow select{border:2px solid var(--line);border-radius:10px;background:var(--paper-2);padding:6px 8px;width:100%}
.edstep{display:grid;grid-template-columns:32px 1fr auto auto;gap:8px;align-items:center}
.edstep textarea{min-height:48px}
.stepno{font-family:var(--display);width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--mango)}
.artpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.artopt{border:3px solid var(--line);border-radius:12px;background:var(--paper-2);padding:2px;cursor:pointer;height:56px}
.artopt svg{width:100%;height:100%}
.artopt[aria-pressed="true"]{background:var(--mango);box-shadow:0 0 0 3px var(--berry)}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);cursor:pointer}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 4px var(--paper),0 0 0 7px var(--line)}
.festpick .tick{font-size:.8rem}
.err{color:var(--berry);font-weight:900}
#ed-root .ba{z-index:58}

  .cvpaper{position:static}
