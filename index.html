}

/* ---------- Render & routing ---------- */
const TABS=["home","planner","recipes","festivals","learn","journal"];
function render(enter){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab)));
  view.innerHTML=tab==="home"?homeView():tab==="planner"?plannerView():tab==="recipes"?recipesView():tab==="festivals"?festivalsView():tab==="learn"?learnView():journalView();
  view.querySelectorAll(".section>*").forEach((c,i)=>c.style.setProperty("--s",Math.min(i,8)));
  view.querySelectorAll(".grid,.sessions,.entries,.badges,.passport,.festlist").forEach(g=>[...g.children].forEach((c,i)=>c.style.setProperty("--n",Math.min(i,12))));
  hydrateMedia(view);
  if(tab==="home")newStamp=null;
  newEntry=null;lastTick=null;
  if(enter){view.classList.remove("enter");void view.offsetWidth;view.classList.add("enter");clearTimeout(enterT);enterT=setTimeout(()=>view.classList.remove("enter"),1800);if(tab==="home")countUp();}
}
function go(t,anchor,sub){
  tab=t;if(t==="learn")learnPage=sub===undefined?learnPage:sub||null;
  try{history.replaceState(null,"","#"+(t==="learn"&&learnPage?"learn-"+learnPage:t));}catch(e){}
  render(true);
  if(anchor){const el=document.getElementById(anchor);if(el)el.scrollIntoView({behavior:"smooth"});}else window.scrollTo({top:0});
}
function rbChanged(){RB.shown=24;render();}

/* ---------- Events ---------- */
document.querySelector("nav.tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(b)go(b.dataset.tab,null,b.dataset.tab==="learn"?null:undefined);});
function pickRandom(list){return list[Math.floor(Math.random()*list.length)];}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-a]");if(!t)return;
  const a=t.dataset.a;
  if(a==="close"){if(t.classList.contains("overlay")&&e.target!==t)return;closeModal();return;}
  if(t.tagName==="LABEL")return;
  switch(a){
  case "go":go(t.dataset.to,t.dataset.anchor);break;
  case "learn":go("learn",null,t.dataset.p||null);break;
  case "motion":state.calm=!state.calm;save();applyMotion();if(!state.calm){render(true);toast("Wiggles are back on!");}break;
  case "pip":{const bd=currentBuddy(),jokes=PIP_TALK.filter(x=>x.includes("?")),tips=PIP_TALK.filter(x=>!x.includes("?")),pool=bd.personality==="silly"?jokes.concat(jokes,tips):bd.personality==="wise"?tips.concat(FACTS):PIP_TALK;const n=pipIdx++;const line=bd.saying&&n%4===3?bd.saying:pool[n%pool.length];const b=document.getElementById("pip-line");if(b){b.textContent=line;b.classList.remove("say");void b.offsetWidth;b.classList.add("say");}t.classList.remove("jump");void t.offsetWidth;t.classList.add("jump");burstAt(t,14);break;}
  case "open":recipeModal(t.dataset.id);break;
  case "scale":MS=+t.dataset.x;recipeModal(modalId);break;
  case "add":{const i=+t.dataset.slot,w=week(viewWeek),r=getR(t.dataset.id);w.sessions[i].recipe=t.dataset.id;w.sessions[i].done=false;w.sessions[i].x=MS;save();closeModal();PICK=null;toast(`${r.name} added to Bake ${i+1}!`);go("planner");break;}
  case "pick":PICK=+t.dataset.slot;go("recipes");break;
  case "cancelpick":PICK=null;go("planner");break;
  case "clearslot":{const s=week(viewWeek).sessions[+t.dataset.slot];s.recipe="";s.done=false;s.x=1;save();render();break;}
  case "slotsurprise":{const list=LIB.filter(r=>r.level==="easy"&&(r.seasons.length===0||r.seasons.includes(NOW_SEASON)));const r=pickRandom(list);const s=week(viewWeek).sessions[+t.dataset.slot];s.recipe=r.id;s.x=1;s.done=false;save();render();burstAt(t,20);toast(`${BN()} picked ${r.name}!`);break;}
  case "week":{const n=+t.dataset.n;if(n===0)viewWeek=thisWeek;else{const d=fromKey(viewWeek);d.setDate(d.getDate()+7*n);viewWeek=dkey(d);}render();break;}
  case "shop":week(viewWeek).shop=t.dataset.shop;save();render();break;
  case "done":{const w=week(viewWeek),s=w.sessions[+t.dataset.slot];const had=stamps(state);s.done=true;save();confetti();const r=getR(s.recipe);if(r&&r.country&&!had.has(r.country))newStamp=r.country;const d=fromKey(viewWeek);d.setDate(d.getDate()+s.day);const dd=d>TODAY?TODAY:d;newDraft({name:r?r.name:"",helper:s.helper,date:dkey(dd)});toast("Amazing baking! Now write about it in your journal.");go("journal");break;}
  case "undo":week(viewWeek).sessions[+t.dataset.slot].done=false;save();render();break;
  case "copylist":{const w=week(viewWeek);const items=shoppingItems(w).filter(i=>!w.ticks[i.key]);copyText(`Baking shopping list (${w.shop}):\n`+items.map(i=>`- ${i.name}: ${fmtQty(i.qty,i.unit)}`).join("\n"),"List copied! Paste it into a message for your grown-up.");break;}
  case "rbtoggle":RB[t.dataset.k]=!RB[t.dataset.k];rbChanged();break;
  case "rbset":RB[t.dataset.k]=t.dataset.v;rbChanged();break;
  case "rbreset":RB={q:"",vegan:false,gf:false,ls:false,nf:false,type:"all",season:"any",level:"all",fest:"",mine:false,shown:24};render();break;
  case "more":RB.shown+=24;render();break;
  case "surprise":{const list=filtered();if(!list.length){toast("No recipes match your filters. Try clearing some.");break;}burstAt(t,24);recipeModal(pickRandom(list).id);break;}
  case "seasonal":RB=Object.assign(RB,{season:NOW_SEASON,fest:"",shown:24});go("recipes");break;
  case "festfilter":closeModal();RB=Object.assign(RB,{fest:t.dataset.f,season:"any",shown:24});go("recipes");break;
  case "bake":openBakeAlong(t.dataset.id);break;
  case "baclose":closeBA();break;
  case "bastep":{const r=getR(BA.id),d=+t.dataset.d;if(d>0&&BA.step===r.steps.length-1){stopTimer();BA.done=true;}else{BA.step=Math.max(0,Math.min(r.steps.length-1,BA.step+d));if(d>0)burstAt(t,18);}renderBA();const el=document.querySelector(".ba");if(el)el.scrollTo({top:0});break;}
  case "batimer":{const T=BA&&BA.timer;if(!T)break;if(t.dataset.v==="reset"){stopTimer();T.left=T.total;renderBA();break;}if(T.left===0)break;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume&&audioCtx.resume();}catch(_){}if(T.running)stopTimer();else{T.running=true;T.iv=setInterval(timerTick,1000);}renderBA();break;}
  case "bajournal":{const r=getR(BA.id);closeBA();newDraft({name:r?r.name:""});go("journal");break;}
  case "quiz":{const id=t.dataset.l,l=LESSONS.find(x=>x.id===id),i=+t.dataset.o;if(i===l.quiz.a){state.lessons[id]=true;delete quizWrong[id];save();confetti();toast("Correct! +2 stars for you.");}else quizWrong[id]=i;render();const d=document.getElementById("lesson-"+id);if(d)d.open=true;break;}
  case "sq":{const q=+t.dataset.q,o=+t.dataset.o;state.safety[q]=o;save();const all=SAFETY_QUIZ.every((x,i)=>state.safety[i]===x.a);if(o===SAFETY_QUIZ[q].a)burstAt(t,16);if(all){confetti();toast("You're a Safety Star!");}render();break;}
  /* buddy studio */
  case "studio":openStudio("choose");break;
  case "bsclose":BS=null;renderStudio();render();break;
  case "bsmode":BS.mode=t.dataset.v;BS.confirm=null;if(t.dataset.v==="make"&&!BS.draft.id&&!BS.draft.name)BS.draft=Object.assign({},currentBuddy(),{id:null,name:"",saying:""});renderStudio();break;
  case "bsuse":{state.buddy=t.dataset.id;save();renderStudio();render();burstAt(t,24);toast(`Hello! I'm ${BN()}, your new baking buddy!`);break;}
  case "bsedit":{const b=state.buddies.find(x=>x.id===t.dataset.id);BS.draft=Object.assign({},b);BS.mode="make";renderStudio();break;}
  case "bsaskdel":BS.confirm=t.dataset.id;renderStudio();break;
  case "bsnodel":BS.confirm=null;renderStudio();break;
  case "bsdel":{state.buddies=state.buddies.filter(x=>x.id!==t.dataset.id);if(state.buddy===t.dataset.id)state.buddy="pip";BS.confirm=null;save();renderStudio();render();break;}
  case "bspart":BS.draft[t.dataset.k]=t.dataset.v;renderStudio();break;
  case "bscheeks":BS.draft.cheeks=!BS.draft.cheeks;renderStudio();break;
  case "bsrandom":Object.assign(BS.draft,randomBuddy());renderStudio();break;
  case "bssave":{const d=BS.draft;if(!(d.name||"").trim()){toast("Give your buddy a name first!");const n=document.getElementById("bs-name");if(n)n.focus();break;}d.name=d.name.trim();if(!d.id){d.id="my-"+Date.now().toString(36);state.buddies.push(Object.assign({},d));}else state.buddies=state.buddies.map(b=>b.id===d.id?Object.assign({},d):b);state.buddy=d.id;save();BS=null;renderStudio();render();confetti();toast(`Hello! I'm ${state.buddies.find(b=>b.id===state.buddy).name}, your new baking buddy!`);break;}
  /* recipe editor */
  case "newcustom":ED=blankED();edError="";closeModal();renderEditor();break;
  case "makeown":{const r=getR(t.dataset.id);ED=edFromRecipe(r);edError="";closeModal();renderEditor();break;}
  case "editcustom":{const c=state.custom.find(x=>x.id===t.dataset.id);ED=JSON.parse(JSON.stringify(c));ED.labels=ED.labels||{};ED.ing.forEach(x=>{if(!x.aisle)x.aisle="Other bits";});edError="";closeModal();renderEditor();break;}
  case "askdelcustom":modalConfirm=true;recipeModal(modalId);break;
  case "keepcustom":modalConfirm=false;recipeModal(modalId);break;
  case "delcustom":{const id=t.dataset.id;state.custom=state.custom.filter(x=>x.id!==id);Object.values(state.weeks).forEach(w=>w.sessions.forEach(s=>{if(s.recipe===id){s.recipe="";s.done=false;}}));save();closeModal();render();toast("Recipe deleted.");break;}
  case "edclose":ED=null;renderEditor();break;
  case "edart":ED.art=t.dataset.v;renderEditor();break;
  case "edaccent":ED.accent=t.dataset.v;renderEditor();break;
  case "edaddi":ED.ing.push({name:"",qty:"",unit:"g",aisle:"Baking aisle"});renderEditor();break;
  case "edrmi":ED.ing.splice(+t.dataset.i,1);if(!ED.ing.length)ED.ing.push({name:"",qty:"",unit:"g",aisle:"Baking aisle"});renderEditor();break;
  case "edadds":ED.steps.push({t:"",g:false});renderEditor();break;
  case "edrms":ED.steps.splice(+t.dataset.i,1);if(!ED.steps.length)ED.steps.push({t:"",g:false});renderEditor();break;
  /* maths */
  case "mx":MATH.x=+t.dataset.x;MATH.people="";render();break;
  case "costadd":{const C=state.cost||defaultCost();C.rows.push(["",0,0,0]);state.cost=C;save();render();break;}
  case "costrm":{const C=state.cost||defaultCost();C.rows.splice(+t.dataset.i,1);state.cost=C;save();render();break;}
  case "costreset":state.cost=defaultCost();save();render();break;
  /* business & careers */
  case "copyplan":{const p=state.plan;copyText(`MY MINI BUSINESS PLAN\nName: ${p.name||""}\nWhat I'll sell: ${p.sell||""}\nCustomers: ${p.who||""}\nWhere: ${p.where||""}\nPrice: ${p.price||""}\nWhat makes me special: ${p.special||""}\nMy goal: ${p.goal||""}`,"Business plan copied!");break;}
  case "copycv":copyText(cvText(),"CV copied! Paste it into a document to print.");break;
  case "cvstats":{const n=state.journal.length,done=Object.values(state.weeks).reduce((a,w)=>a+w.sessions.filter(s=>s.done).length,0);const names=[...new Set(journalRecipes(state).map(r=>r.name))].slice(0,3);const line=`I have completed ${done} planned baking session${done===1?"":"s"} and kept a baking journal with ${n} page${n===1?"":"s"}${names.length?`, including ${names.join(", ")}`:""}.`;state.cv.experience=((state.cv.experience||"").trim()+" "+line).trim();save();render();toast("Stats added to your CV!");break;}
  case "cvbadges":{const got=BADGES.filter(b=>b.test(state)).map(b=>b.title);if(!got.length){toast("Earn some badges first!");break;}state.cv.achievements=((state.cv.achievements||"").trim()+" Whisk & Wonder badges: "+got.join(", ")+".").trim();save();render();break;}
  /* journal */
  case "newentry":newDraft();render();break;
  case "cancelentry":{if(REC)stopRec();if(DICT){DICT.rec.stop();DICT=null;}[...jDraft.photos,...jDraft.audio].forEach(mDel);jDraft=null;voiceAsk=null;render();break;}
  case "mood":readDraft();jDraft.mood=t.dataset.m;render();break;
  case "star":readDraft();jDraft.stars=+t.dataset.n;render();break;
  case "rmphoto":{readDraft();const [id]=jDraft.photos.splice(+t.dataset.i,1);mDel(id);render();break;}
  case "rmaudio":{readDraft();const [id]=jDraft.audio.splice(+t.dataset.i,1);mDel(id);render();break;}
  case "recstart":startRec();break;
  case "recstop":stopRec();break;
  case "dictate":dictate(t.dataset.t);break;
  case "voiceok":{state.voiceOK=true;save();const tg=voiceAsk;voiceAsk=null;render();dictate(tg);break;}
  case "voiceno":voiceAsk=null;render();break;
  case "askdel":confirmDel=t.dataset.id;render();break;
  case "nodel":confirmDel=null;render();break;
  case "del":{const j=state.journal.find(x=>x.id===t.dataset.id);if(j)[...(j.photos||[]),...(j.audio||[])].forEach(mDel);state.journal=state.journal.filter(x=>x.id!==t.dataset.id);confirmDel=null;save();render();break;}
  case "backup":backup();break;
  case "restoreyes":restore();break;
  case "restoreno":restoreFile=null;render();break;
  }
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.dataset.s!==undefined){const s=week(viewWeek).sessions[+t.dataset.s];const k=t.dataset.k;s[k]=k==="day"?+t.value:t.value;save();render();return;}
  if(t.dataset.tick){const w=week(viewWeek);if(t.checked){w.ticks[t.dataset.tick]=true;lastTick=t.dataset.tick;}else delete w.ticks[t.dataset.tick];save();const items=shoppingItems(w);if(t.checked&&items.every(i=>w.ticks[i.key]))confetti();else if(t.checked)burstAt(t.closest(".item").querySelector(".box"),16);render();const el=document.getElementById(t.id);if(el)el.focus({preventScroll:true});return;}
  if(t.id==="rb-fest"){RB.fest=t.value;rbChanged();return;}
  if(t.id==="j-photo"){readDraft();const files=[...t.files].slice(0,6);for(const f of files){try{const b=await shrink(f);const id="p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);await mPut(id,b);jDraft.photos.push(id);}catch(err){toast("Couldn't save that photo on this device.");}}render();if(files.length)toast(files.length>1?"Photos added!":"Photo added!");return;}
  if(t.id==="restore-file"){restoreFile=t.files[0]||null;render();return;}
  if(t.dataset.m==="recipeName"){const r=findByName(t.value);if(r){MATH.recipe=r.id;render();}else toast("Pick a recipe name from the list.");return;}
  if(t.dataset.m==="readyName"){const r=findByName(t.value);if(r){MATH.readyRecipe=r.id;render();}else toast("Pick a recipe name from the list.");return;}
  if(ED&&t.dataset.edl){ED.labels[t.dataset.edl]=t.checked;return;}
  if(ED&&t.dataset.edf){const f=t.dataset.edf;ED.festivals=ED.festivals.filter(x=>x!==f);if(t.checked)ED.festivals.push(f);return;}
  if(ED&&t.dataset.eds!==undefined&&t.dataset.k==="g"){ED.steps[+t.dataset.eds].g=t.checked;return;}
  if(ED&&t.dataset.edi!==undefined&&t.dataset.k==="name"){const x=ED.ing[+t.dataset.edi];x.name=t.value;const k=ING[t.value.trim()];if(k){x.aisle=AISLES[k.a]||"Other bits";renderEditor();}return;}
  if(t.dataset.cvskill){const s=t.dataset.cvskill;state.cv.skills=(state.cv.skills||[]).filter(x=>x!==s);if(t.checked)state.cv.skills.push(s);save();const p=document.getElementById("cv-preview");if(p)p.textContent=cvText();return;}
  if(t.dataset.m||t.dataset.mp||t.dataset.c||t.dataset.cr!==undefined)render();
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(BS&&t.dataset.bs){BS.draft[t.dataset.bs]=t.value;const pv=document.querySelector(".studiopreview h3");if(pv&&t.dataset.bs==="name")pv.textContent=t.value||"My buddy";const bb=document.querySelector(".studiopreview .bubble");if(bb&&t.dataset.bs==="saying")bb.textContent=t.value||"Hello! I'm your new baking buddy.";return;}
  if(t.id==="baker-name"){state.name=t.value;save();const h=document.getElementById("hello-name");if(h)h.textContent=state.name.trim()||"Super Baker";const pl=document.getElementById("pip-line");if(pl)pl.textContent=pipLine();return;}
  if(t.id==="rb-q"){RB.q=t.value;RB.shown=24;clearTimeout(rbT);rbT=setTimeout(()=>{const pos=t.selectionStart;render();const n=document.getElementById("rb-q");if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}},250);return;}
  if(ED){
    if(t.dataset.ed){ED[t.dataset.ed]=t.dataset.ed==="sv"?(+t.value||1):t.value;return;}
    if(t.dataset.edi!==undefined){const x=ED.ing[+t.dataset.edi];x[t.dataset.k]=t.value;return;}
    if(t.dataset.eds!==undefined&&t.dataset.k==="t"){ED.steps[+t.dataset.eds].t=t.value;return;}
  }
  if(t.dataset.m&&!t.dataset.m.endsWith("Name")){const k=t.dataset.m;MATH[k]=(k==="ready")?t.value:(k==="people"?t.value:(+t.value||0));if(k==="people"&&!t.value)MATH.x=1;refreshMath(t);return;}
  if(t.dataset.mp){const side=t.dataset.mp[0],i=+t.dataset.mp[1];MATH["pack"+side][i]=+t.value||0;refreshMath(t);return;}
  if(t.dataset.c){const C=state.cost||defaultCost();C[t.dataset.c]=+t.value||0;state.cost=C;save();refreshMath(t);return;}
  if(t.dataset.cr!==undefined){const C=state.cost||defaultCost();C.rows[+t.dataset.cr][+t.dataset.k]=t.dataset.k==="0"?t.value:(+t.value||0);state.cost=C;save();refreshMath(t);return;}
  if(t.dataset.plan){state.plan[t.dataset.plan]=t.value;save();return;}
  if(t.dataset.cv){state.cv[t.dataset.cv]=t.value;save();const p=document.getElementById("cv-preview");if(p)p.textContent=cvText();return;}
});
let rbT=null,mT=null;
function refreshMath(input){clearTimeout(mT);mT=setTimeout(()=>{const id=input.id,cr=input.dataset.cr,k=input.dataset.k,pos=input.type==="text"?input.selectionStart:null;render();let n=id?document.getElementById(id):null;if(!n&&cr!==undefined)n=document.querySelector(`[data-cr="${cr}"][data-k="${k}"]`);if(n){n.focus({preventScroll:true});if(pos!==null)try{n.setSelectionRange(pos,pos);}catch(_){}}},400);}
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="edform"){
    const ing=ED.ing.filter(x=>x.name.trim()),steps=ED.steps.filter(s=>s.t.trim());
    if(!ED.name.trim()){edError="Give your recipe a name.";renderEditor();return;}
    if(!ing.length){edError="Add at least one ingredient.";renderEditor();return;}
    if(!steps.length){edError="Add at least one step to the method.";renderEditor();return;}
    const rec=Object.assign({},ED,{name:ED.name.trim(),ing:ing.map(x=>({name:x.name.trim(),qty:+x.qty||0,unit:x.unit,aisle:x.aisle})),steps});
    if(rec.id){state.custom=state.custom.map(c=>c.id===rec.id?rec:c);}else{rec.id="c-"+Date.now().toString(36);state.custom.unshift(rec);}
    save();ED=null;renderEditor();confetti();toast("Recipe saved to your Recipe Book!");if(tab!=="recipes")go("recipes");else render();recipeModal(rec.id);return;
  }
  if(e.target.id!=="jform")return;
  readDraft();if(REC)stopRec();if(DICT){DICT.rec.stop();DICT=null;}
  const r=findByName(jDraft.name);
  if(!r&&!jDraft.name.trim()){toast("Type the name of your bake first.");return;}
  const nid="j"+Date.now().toString(36);newEntry=nid;
  const before=stamps(state);
  state.journal.push({id:nid,date:jDraft.date,recipe:r?r.id:"",other:r?"":jDraft.name.trim(),helper:jDraft.helper,mood:jDraft.mood,stars:jDraft.stars,fav:jDraft.fav.trim(),next:jDraft.next.trim(),photos:jDraft.photos,audio:jDraft.audio});
  jDraft=null;voiceAsk=null;save();confetti();
  if(r&&r.country&&!before.has(r.country))newStamp=r.country;
  toast(r&&r.country&&!before.has(r.country)?`New passport stamp: ${r.country}!`:"Page added to your journal!");render();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(BS){BS=null;renderStudio();render();}else if(ED){ED=null;renderEditor();}else if(BA)closeBA();else closeModal();}});
document.getElementById("motion-toggle").addEventListener("click",()=>{state.calm=!state.calm;save();applyMotion();if(!state.calm){render(true);toast("Wiggles are back on!");}});

/* ---------- Start ---------- */
const h=(location.hash||"").slice(1);
if(TABS.includes(h))tab=h;
else if(h.startsWith("learn-")){tab="learn";learnPage=h.slice(6);if(!LEARN.some(l=>l.id===learnPage))learnPage=null;}
applyMotion();
render(true);
})();
