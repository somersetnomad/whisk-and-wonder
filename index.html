 i:[["plain flour",350,"g"],["bicarbonate of soda",1,"tsp"],["ground ginger",2,"tsp"],["ground cinnamon",1,"tsp"],["dairy-free baking block",125,"g"],["light brown soft sugar",175,"g"],["golden syrup",5,"tbsp"],["unsweetened soya milk",2,"tbsp"],["icing sugar",100,"g"]],
 st:[O(180,160,"Line two baking trays."),"Mix the flour, bicarbonate of soda and spices in a big bowl.","Rub in the dairy-free block, then stir in the sugar.","Add the syrup and soya milk and mix to a dough.","Roll out between two sheets of baking paper and cut out your shapes.","!Bake for 10 to 12 minutes.","Cool, then pipe on icing decorations."],mx:3,bk:5,
 tip:"Chill the dough for 15 minutes if it's too sticky to roll."},
{id:"gingerbread-gf",n:"Gluten-free Gingerbread People",vn:"Gluten-free Gingerbread {x}",a:"gingerbread",pk:["deco"],keep:["gf"],t:"sweet",lv:2,tm:"55 min",mk:"20 biscuits",sv:20,o:"United Kingdom",se:["winter"],fe:["christmas"],sk:"Gluten-free baking",
 intro:"Crisp, spicy gingerbread that's gluten-free.",
 i:[["gluten-free plain flour blend",350,"g"],["xanthan gum",1,"tsp"],["bicarbonate of soda",1,"tsp"],["ground ginger",2,"tsp"],["ground cinnamon",1,"tsp"],["unsalted butter",125,"g"],["light brown soft sugar",175,"g"],["eggs",1,""],["golden syrup",4,"tbsp"],["icing sugar",100,"g"]],
 st:[O(180,160,"Line two baking trays."),"Mix the flour, xanthan gum, bicarbonate of soda and spices.","Rub in the butter, then stir in the sugar.","Beat the egg with the syrup, pour in and mix to a dough. Chill for 20 minutes.","Roll out between two sheets of baking paper and cut out shapes.","!Bake for 10 to 12 minutes.","Cool on the tray (they're fragile when warm), then decorate."],mx:3,bk:5,
 tip:"Gluten-free dough cracks more easily. Patch cracks by pressing them together with your fingers."},
{id:"cutout",n:"Cut-out Biscuits",vn:"Iced {x}",a:"cookie",pk:["deco"],t:"sweet",lv:2,tm:"1 hr",mk:"20 biscuits",sv:20,o:"United Kingdom",sk:"Rolling and decorating",
 intro:"Plain vanilla biscuits that keep their shape, ready for decorating for every festival in the year.",
 i:[["unsalted butter",100,"g"],["caster sugar",100,"g"],["eggs",1,""],["vanilla extract",1,"tsp"],["plain flour",275,"g"],["icing sugar",150,"g"],["gel food colouring",0,""]],
 st:["Beat the soft butter and sugar until creamy.","Beat in the egg and vanilla.","Mix in the flour to make a dough. Wrap and chill for 20 minutes.",O(180,160,"Line two baking trays."),"Roll the dough out between two sheets of baking paper to the thickness of a coin and cut out your shapes.","!Bake for 8 to 10 minutes until just golden at the edges.","Cool completely. Mix the icing sugar with a few drops of water, colour it and decorate."],mx:2,bk:5,
 tip:"Thick icing for outlines, slightly runnier icing for filling in. That's how the pros do it!"},
{id:"cutout-vegan",n:"Vegan Cut-out Biscuits",vn:"Vegan Iced {x}",a:"cookie",pk:["deco"],keep:["vegan"],t:"sweet",lv:2,tm:"1 hr",mk:"20 biscuits",sv:20,o:"United Kingdom",sk:"Vegan baking",
 intro:"Vegan vanilla biscuits that hold their shape for decorating.",
 i:[["dairy-free baking block",100,"g"],["caster sugar",100,"g"],["unsweetened soya milk",2,"tbsp"],["vanilla extract",1,"tsp"],["plain flour",275,"g"],["icing sugar",150,"g"],["gel food colouring",0,""]],
 st:["Beat the dairy-free block and sugar until creamy.","Beat in the soya milk and vanilla.","Mix in the flour to make a dough. Wrap and chill for 20 minutes.",O(180,160,"Line two baking trays."),"Roll out between two sheets of baking paper and cut out your shapes.","!Bake for 8 to 10 minutes.","Cool completely, then ice and decorate."],mx:2,bk:5,
 tip:"Some food colourings aren't vegan. Check the label."},
{id:"cutout-gf",n:"Gluten-free Cut-out Biscuits",vn:"Gluten-free Iced {x}",a:"cookie",pk:["deco"],keep:["gf"],t:"sweet",lv:2,tm:"1 hr",mk:"20 biscuits",sv:20,o:"United Kingdom",sk:"Gluten-free baking",
 intro:"Gluten-free vanilla biscuits for decorating.",
 i:[["unsalted butter",100,"g"],["caster sugar",100,"g"],["eggs",1,""],["vanilla extract",1,"tsp"],["gluten-free plain flour blend",275,"g"],["xanthan gum",0.5,"tsp"],["icing sugar",150,"g"],["gel food colouring",0,""]],
 st:["Beat the butter and sugar until creamy.","Beat in the egg and vanilla.","Mix in the flour and xanthan gum. Wrap and chill for 30 minutes.",O(180,160,"Line two baking trays."),"Roll out between two sheets of baking paper and cut out your shapes.","!Bake for 8 to 10 minutes.","Cool completely on the tray, then ice and decorate."],mx:2,bk:5,
 tip:"Lift gluten-free shapes with a palette knife so they don't break."},
{id:"almondcookies",n:"Almond Cookies",vn:"{x} Almond Cookies",a:"cookie",pk:[],t:"sweet",lv:1,tm:"35 min",mk:"20 cookies",sv:20,o:"China",se:["winter"],fe:["lunarny"],sk:"Rolling and shaping",
 intro:"These round, golden cookies look like coins, so families eat them at Lunar New Year to wish for good luck.",
 i:[["plain flour",150,"g"],["ground almonds",75,"g"],["icing sugar",75,"g"],["bicarbonate of soda",0.25,"tsp"],["unsalted butter",100,"g"],["eggs",1,""],["whole almonds",20,""]],
 st:[O(170,150,"Line two trays."),"Mix the flour, ground almonds, icing sugar and bicarbonate of soda.","Rub in the soft butter, then add half the beaten egg and mix to a dough.","Roll into 20 balls and press each one flat on the tray.","Press an almond into the middle of each and brush with the rest of the egg.","!Bake for 15 to 18 minutes until golden.","Cool on the tray."],mx:2,bk:5,
 tip:"Cookies shaped like coins are a wish for a lucky, happy year."},
{id:"nankhatai",n:"Nankhatai",vn:"{x} Nankhatai",a:"cookie",pk:[],t:"sweet",lv:1,tm:"35 min",mk:"16 biscuits",sv:16,o:"India",fe:["diwali"],sk:"Creaming",
 intro:"Melt-in-the-mouth Indian shortbread flavoured with cardamom, often shared with friends and neighbours at Diwali.",
 i:[["unsalted butter",100,"g"],["icing sugar",75,"g"],["plain flour",125,"g"],["gram flour",25,"g"],["ground cardamom",0.5,"tsp"],["baking powder",0.25,"tsp"],["pistachios",15,"g"]],
 st:[O(170,150,"Line a baking tray."),"Beat the soft butter and icing sugar until very pale and fluffy.","Mix in the flours, cardamom and baking powder to make a soft dough.","Roll into 16 balls and flatten them slightly on the tray.","!Chop the pistachios and press a few on top of each one.","!Bake for 15 to 18 minutes until they crack a little on top.","Cool on the tray. They firm up as they cool."],mx:2,bk:5,
 tip:"Gram flour is made from chickpeas. You'll find it in the world foods aisle."},
{id:"atta",n:"Atta Biscuits",vn:"{x} Atta Biscuits",a:"cookie",pk:[],t:"sweet",lv:1,tm:"35 min",mk:"16 biscuits",sv:16,o:"India",se:["spring"],fe:["vaisakhi","diwali"],sk:"Creaming",
 intro:"Crunchy wholewheat biscuits from Punjab, perfect with a glass of milk on Vaisakhi, the spring harvest festival.",
 i:[["wholemeal flour",150,"g"],["unsalted butter",100,"g"],["caster sugar",75,"g"],["ground cardamom",0.5,"tsp"],["baking powder",0.5,"tsp"],["milk",2,"tbsp"]],
 st:[O(180,160,"Line a baking tray."),"Beat the butter and sugar until creamy.","Mix in the flour, cardamom, baking powder and milk to make a dough.","Roll into 16 balls and press flat with a fork.","!Bake for 15 minutes until golden.","Cool on the tray."],mx:2,bk:4,
 tip:"Atta is the Indian word for wholewheat flour."},
{id:"maamoul",n:"Date Ma'amoul",vn:"{x} Ma'amoul",a:"dome",pk:[],t:"sweet",lv:2,tm:"1 hr",mk:"16 biscuits",sv:16,cu:"Middle Eastern baking",fe:["eidfitr","eidadha"],sk:"Shaping and filling",
 intro:"Buttery biscuits filled with dates, baked in the Middle East for Eid. Families often make them together the night before.",
 i:[["fine semolina",200,"g"],["plain flour",75,"g"],["unsalted butter",125,"g"],["caster sugar",2,"tbsp"],["orange blossom water",1,"tbsp"],["milk",3,"tbsp"],["pitted dates",200,"g"],["ground cinnamon",0.5,"tsp"],["icing sugar",2,"tbsp"]],
 st:["!Melt the butter. Mix it with the semolina, flour and sugar, then cover and rest for 30 minutes.","!Chop the dates and mash them with the cinnamon and a splash of water into a paste.","Add the orange blossom water and milk to the dough and knead until smooth.",O(180,160,"Line a tray."),"Flatten a walnut-sized ball of dough in your palm, add a little date paste and close it up into a ball.","Press a pattern on top with a fork or a ma'amoul mould.","!Bake for 15 to 20 minutes until just golden underneath.","Cool, then dust with icing sugar."],mx:2,bk:6,
 tip:"Ma'amoul should stay pale on top. Check underneath to see if they're done."},
{id:"macaroons",n:"Coconut Macaroons",vn:"{x} Coconut Macaroons",a:"macaroon",pk:[],keep:["gf"],t:"sweet",lv:1,tm:"35 min",mk:"16 macaroons",sv:16,cu:"Jewish baking tradition",fe:["passover"],sk:"Whisking egg whites",
 intro:"Chewy coconut mountains with no flour, popular during Passover when many Jewish families don't eat foods made with risen flour.",
 i:[["desiccated coconut",200,"g"],["eggs",2,""],["caster sugar",75,"g"],["vanilla extract",1,"tsp"],["dark chocolate (dairy-free)",50,"g"]],
 st:[O(170,150,"Line a baking tray."),"Separate the eggs and put the whites in a clean bowl. A grown-up can show you how.","Whisk the whites until frothy, then stir in the sugar, vanilla and coconut.","Squeeze tablespoons of the mixture into 16 little mountains on the tray.","!Bake for 15 to 18 minutes until the tips are golden.","!When cool, melt the chocolate and dip the bottoms or drizzle over the tops."],mx:3,bk:4,
 tip:"Wet your hands to shape the mountains. The mixture won't stick."},
/* ---------- Bars ---------- */
{id:"flapjack",n:"Golden Flapjacks",vn:"{x} Flapjacks",a:"bar",pk:["flapjack"],t:"sweet",lv:1,tm:"40 min",mk:"12 bars",sv:12,o:"United Kingdom",sk:"Melting method",
 intro:"Chewy, golden oat bars. One of the easiest bakes there is!",
 i:[["unsalted butter",125,"g"],["light brown soft sugar",75,"g"],["golden syrup",4,"tbsp"],["porridge oats",250,"g"]],
 st:[O(180,160,"Line a 20 cm square tin."),"!Melt the butter, sugar and syrup in a big pan over a low heat, stirring.","Take it off the heat and stir in the oats until they're all coated.","Press into the tin with the back of a spoon.","!Bake for 20 to 25 minutes until golden at the edges.","!Cut into 12 bars while warm, then leave to cool completely in the tin."],mx:2,bk:4,
 tip:"Press the mixture down firmly, or your flapjacks will crumble."},
{id:"flapjack-vegan",n:"Vegan Flapjacks",vn:"Vegan {x} Flapjacks",a:"bar",pk:["flapjack"],keep:["vegan"],t:"sweet",lv:1,tm:"40 min",mk:"12 bars",sv:12,o:"United Kingdom",sk:"Vegan baking",
 intro:"Golden syrup is vegan, so flapjacks are easy to make plant-based.",
 i:[["dairy-free baking block",125,"g"],["light brown soft sugar",75,"g"],["golden syrup",4,"tbsp"],["porridge oats",250,"g"]],
 st:[O(180,160,"Line a 20 cm square tin."),"!Melt the dairy-free block, sugar and syrup in a big pan over a low heat.","Take it off the heat and stir in the oats.","Press into the tin.","!Bake for 20 to 25 minutes until golden.","!Cut into bars while warm and cool in the tin."],mx:2,bk:4,
 tip:"Golden syrup is made from sugar cane or beet, so it's vegan. Honey isn't."},
{id:"flapjack-gf",n:"Gluten-free Flapjacks",vn:"Gluten-free {x} Flapjacks",a:"bar",pk:["flapjack"],keep:["gf"],t:"sweet",lv:1,tm:"40 min",mk:"12 bars",sv:12,o:"United Kingdom",sk:"Gluten-free baking",
 intro:"Use oats labelled gluten-free and flapjacks are safe for coeliacs.",
 i:[["unsalted butter",125,"g"],["light brown soft sugar",75,"g"],["golden syrup",4,"tbsp"],["gluten-free porridge oats",250,"g"]],
 st:[O(180,160,"Line a 20 cm square tin."),"!Melt the butter, sugar and syrup over a low heat.","Take off the heat and stir in the oats.","Press into the tin.","!Bake for 20 to 25 minutes until golden.","!Cut into bars while warm and cool in the tin."],mx:2,bk:4,
 tip:"Ordinary oats can pick up gluten in the factory. That's why you need ones labelled gluten-free."},
{id:"oatbar",n:"Fruity Oat Bars",vn:"{x} Oat Bars",a:"bar",pk:["flapjack"],keep:["vegan","gf","lowsugar"],t:"sweet",lv:1,tm:"40 min",mk:"12 bars",sv:12,o:"United Kingdom",sk:"Low-sugar baking",
 intro:"Sweetened with bananas and dates instead of syrup. Vegan, gluten-free and low in added sugar.",
 i:[["gluten-free porridge oats",200,"g"],["ripe bananas",2,""],["pitted dates",100,"g"],["sunflower oil",3,"tbsp"],["ground cinnamon",1,"tsp"]],
 st:[O(180,160,"Line a 20 cm square tin."),"!Chop the dates small.","Mash the bananas, then stir in the oil and cinnamon.","Stir in the oats and dates.","Press firmly into the tin.","!Bake for 25 minutes until golden.","Cool completely in the tin, then cut into 12 bars."],mx:3,bk:5,
 tip:"Dates are naturally sweet and sticky, so they glue the bars together."},
{id:"parkin",n:"Bonfire Parkin",vn:"{x} Parkin",a:"traybake",pk:[],t:"sweet",lv:2,tm:"1 hr",mk:"16 squares",sv:16,o:"United Kingdom",se:["autumn"],fe:["bonfire","halloween"],sk:"Melting method",
 intro:"A dark, sticky ginger cake from Yorkshire, traditionally eaten on Bonfire Night. It gets stickier the longer you leave it!",
 i:[["unsalted butter",100,"g"],["dark brown soft sugar",100,"g"],["golden syrup",4,"tbsp"],["black treacle",2,"tbsp"],["porridge oats",100,"g"],["self-raising flour",150,"g"],["ground ginger",2,"tsp"],["eggs",1,""],["milk",2,"tbsp"]],
 st:[O(160,140,"Line a 20 cm square tin."),"!Melt the butter, sugar, syrup and treacle together over a low heat.","Mix the oats, flour and ginger in a big bowl.","Pour in the melted mix, then beat in the egg and milk.","Pour into the tin.","!Bake for 40 to 45 minutes until firm.","Cool, cut into squares and keep in a tin for a few days to get sticky."],mx:3,bk:5,
 tip:"Grease the spoon before measuring treacle. It's the stickiest stuff in the kitchen!"},
/* ---------- Scones ---------- */
{id:"scones",n:"Classic Scones",vn:"{x} Scones",a:"scone",pk:["scone"],t:"sweet",lv:1,tm:"35 min",mk:"8 scones",sv:8,o:"United Kingdom",sk:"Rubbing in",
 intro:"Scones are perfect with jam and cream. Do you say it to rhyme with 'gone' or 'stone'? People in Britain still argue about it!",
 i:[["self-raising flour",225,"g"],["baking powder",1,"tsp"],["unsalted butter",50,"g"],["caster sugar",25,"g"],["milk",125,"ml"],["eggs",1,""]],
 st:[O(220,200,"Line a baking tray."),"Put the flour and baking powder in a big bowl. Add the cold butter in small cubes.","Rub the butter in with your fingertips until it looks like breadcrumbs. Lift your hands high so air falls in!","Stir in the sugar.","Pour in the milk and mix with a butter knife into a soft dough. Don't squish it too much.","Pat it out 2 cm thick and cut circles with a cutter. Push straight down, no twisting.","Beat the egg and brush it on top so they go shiny.","!Bake for 10 to 12 minutes until risen and golden."],mx:3,bk:7,
 tip:"Cold butter and gentle hands make the tallest scones."},
{id:"scones-vegan",n:"Vegan Scones",vn:"Vegan {x} Scones",a:"scone",pk:["scone"],keep:["vegan"],t:"sweet",lv:1,tm:"35 min",mk:"8 scones",sv:8,o:"United Kingdom",sk:"Rubbing in",
 intro:"Tall, fluffy scones without butter, milk or egg.",
 i:[["self-raising flour",225,"g"],["baking powder",1,"tsp"],["dairy-free baking block",50,"g"],["caster sugar",25,"g"],["unsweetened soya milk",140,"ml"]],
 st:[O(220,200,"Line a baking tray."),"Put the flour and baking powder in a bowl with the cold dairy-free block in cubes.","Rub in with your fingertips until it looks like breadcrumbs.","Stir in the sugar.","Pour in most of the soya milk and mix to a soft dough.","Pat out 2 cm thick and cut circles.","Brush the tops with the last of the soya milk.","!Bake for 10 to 12 minutes until golden."],mx:3,bk:7,
 tip:"Keep the dairy-free block in the fridge until the moment you use it."},
{id:"scones-gf",n:"Gluten-free Scones",vn:"Gluten-free {x} Scones",a:"scone",pk:["scone"],keep:["gf"],t:"sweet",lv:1,tm:"35 min",mk:"8 scones",sv:8,o:"United Kingdom",sk:"Gluten-free baking",
 intro:"Soft scones with a golden top, made with gluten-free flour.",
 i:[["gluten-free self-raising flour blend",225,"g"],["xanthan gum",0.5,"tsp"],["baking powder",1,"tsp"],["unsalted butter",50,"g"],["caster sugar",25,"g"],["eggs",1,""],["milk",100,"ml"]],
 st:[O(220,200,"Line a baking tray."),"Mix the flour, xanthan gum and baking powder and rub in the cold butter.","Stir in the sugar.","Beat the egg into the milk, keeping a spoonful back for brushing.","Pour in and mix to a soft dough.","Pat out 2.5 cm thick and cut circles.","Brush with the saved egg mix.","!Bake for 12 to 14 minutes until golden."],mx:2,bk:7,
 tip:"Gluten-free dough is softer. Dust your hands with a little gluten-free flour."},
{id:"scones-cheese",n:"Cheese Scones",vn:"Cheese & {x} Scones",a:"scone",pk:["sav"],t:"savoury",lv:1,tm:"35 min",mk:"8 scones",sv:8,o:"United Kingdom",sk:"Rubbing in",
 intro:"Warm cheese scones are perfect with soup, or split open with a little butter.",
 i:[["self-raising flour",225,"g"],["baking powder",1,"tsp"],["unsalted butter",50,"g"],["vegetarian mature cheddar",75,"g"],["milk",125,"ml"],["eggs",1,""]],
 st:[O(220,200,"Line a baking tray."),"!Grate the cheese. Keep a little for the tops.","Rub the cold butter into the flour and baking powder until it looks like breadcrumbs.","Stir in most of the cheese.","Pour in the milk and mix to a soft dough. If it's sticky, add a little more flour.","Pat out 2 cm thick and cut circles.","Brush with beaten egg and sprinkle with the last of the cheese.","!Bake for 12 to 15 minutes until golden."],mx:3,bk:7,
 tip:"A pinch of smoked paprika makes cheese taste even cheesier."},
{id:"scones-herb-vegan",n:"Vegan Herb Scones",vn:"Vegan {x} Scones",a:"scone",pk:["sav"],keep:["vegan"],t:"savoury",lv:1,tm:"35 min",mk:"8 scones",sv:8,o:"United Kingdom",sk:"Rubbing in",
 intro:"Savoury, herby scones with a cheesy taste from nutritional yeast.",
 i:[["self-raising flour",225,"g"],["baking powder",1,"tsp"],["dairy-free baking block",50,"g"],["nutritional yeast flakes",2,"tbsp"],["dried mixed herbs",1,"tsp"],["unsweetened soya milk",140,"ml"]],
 st:[O(220,200,"Line a baking tray."),"Rub the dairy-free block into the flour and baking powder.","Stir in the nutritional yeast and herbs.","Pour in most of the soya milk and mix to a soft dough.","Pat out 2 cm thick and cut circles.","Brush with the last of the soya milk.","!Bake for 12 to 14 minutes until golden."],mx:2,bk:6,
 tip:"Dip your cutter in flour between each scone so it doesn't stick."},
{id:"welshcakes",n:"Welsh Cakes",vn:"{x} Welsh Cakes",a:"scone",pk:["scone"],t:"sweet",lv:2,tm:"40 min",mk:"16 cakes",sv:16,o:"Wales",fe:["stdavid"],sk:"Griddle baking",
 intro:"Little cakes cooked on a hot griddle, made all over Wales and especially on St David's Day.",
 i:[["self-raising flour",225,"g"],["unsalted butter",100,"g"],["caster sugar",75,"g"],["currants",50,"g"],["mixed spice",0.5,"tsp"],["eggs",1,""],["milk",1,"tbsp"]],
 st:["Rub the butter into the flour until it looks like breadcrumbs.","Stir in the sugar, currants and mixed spice.","Add the egg and milk and mix to a firm dough.","Roll out 5 mm thick and cut into 7 cm rounds.","!Cook on a lightly greased griddle or heavy frying pan over a medium-low heat for 3 minutes on each side until golden.","Sprinkle with a little caster sugar while warm."],mx:1,bk:4,
 tip:"In Welsh they're called picau ar y maen, which means cakes on the stone."},
{id:"tattie",n:"Tattie Scones",vn:"{x} Tattie Scones",a:"pancake",pk:[],t:"savoury",lv:2,tm:"45 min",mk:"8 triangles",sv:8,o:"Scotland",fe:["burns","standrew"],sk:"Griddle baking",
 intro:"Soft potato scones from Scotland, cooked in a pan. Tattie is Scottish for potato!",
 i:[["potatoes",400,"g"],["salted butter",25,"g"],["plain flour",75,"g"],["salt",0.25,"tsp"]],
 st:["!Peel and chop the potatoes and boil them for 15 to 20 minutes until soft. Drain well.","Mash with the butter and salt and let it cool a little.","Mix in the flour to make a soft dough.","Roll out on a floured board to 5 mm thick and cut into triangles.","!Cook in a dry, hot frying pan for 3 to 4 minutes on each side until speckled brown.","Eat warm."],mx:2,bk:4,
 tip:"Leftover mashed potato works perfectly."},
/* ---------- Breads ---------- */
{id:"rolls",n:"Soft Bread Rolls",vn:"{x} Bread Rolls",a:"bread",pk:["bread"],t:"savoury",lv:2,tm:"2 hr",mk:"10 rolls",sv:10,o:"United Kingdom",se:[],fe:["harvest"],sk:"Kneading and proving",
 intro:"Your very own bread! Kneading is hard work but very satisfying.",
 i:[["strong white bread flour",500,"g"],["fast-action dried yeast",7,"g"],["salt",1,"tsp"],["caster sugar",1,"tsp"],["water",300,"ml"],["olive oil",2,"tbsp"]],
 st:["Mix the flour, yeast, salt and sugar in a big bowl.","Pour in the warm water (warm like a bath, not hot) and the oil, and mix to a shaggy dough.","Knead on the table for 10 minutes until smooth and stretchy.","Put it back in the bowl, cover and leave somewhere warm for an hour until it doubles in size.","Punch the air out and divide into 10 balls.","Put them on a lined tray, cover and leave for 30 minutes to puff up.",O(220,200),"!Bake for 15 to 20 minutes. They're done when they sound hollow when you tap the bottom.","Cool on a rack."],mx:4,bk:7,
 tip:"Yeast is alive! Hot water stops it working, so keep the water just warm."},
{id:"focaccia",n:"Bubbly Focaccia",vn:"{x} Focaccia",a:"focaccia",pk:["focaccia"],t:"savoury",lv:2,tm:"2 hr",mk:"12 pieces",sv:12,o:"Italy",sk:"Wet doughs",
 intro:"An Italian bread full of bubbles, with dimples made by poking it with your fingers. Very satisfying!",
 i:[["strong white bread flour",500,"g"],["fast-action dried yeast",7,"g"],["salt",1,"tsp"],["water",400,"ml"],["olive oil",6,"tbsp"],["sea salt flakes",1,"tsp"]],
 st:["Mix the flour, yeast and salt in a big bowl.","Add the warm water and 2 tablespoons of the oil. It's very wet and sticky. That's right! Stir it for 2 minutes with a spoon.","Cover and leave somewhere warm for an hour until bubbly and doubled.","Oil a roasting tin with 2 tablespoons of oil and tip the dough in. Stretch it to the corners with oily fingers.","Leave for 30 minutes to puff up.",O(220,200),"Poke dimples all over with your fingertips, drizzle with the rest of the oil and sprinkle with sea salt.","!Bake for 20 to 25 minutes until golden.","Cool a little, then cut into squares."],mx:6,bk:7,
 tip:"Wet dough makes big bubbles. Don't add extra flour!"},
{id:"pizza",n:"Pizza Faces",vn:"{x} Pizzas",a:"pizza",pk:["pizza"],t:"savoury",lv:2,tm:"1 hr",mk:"4 pizzas",sv:4,o:"Italy",sk:"Kneading and shaping",
 intro:"Make your own dough, then turn your toppings into funny faces before baking.",
 i:[["strong white bread flour",300,"g"],["fast-action dried yeast",7,"g"],["salt",0.5,"tsp"],["water",200,"ml"],["olive oil",1,"tbsp"],["passata",150,"ml"],["dried oregano",1,"tsp"],["vegetarian mozzarella",125,"g"]],
 st:["Mix the flour, yeast and salt in a bowl.","Pour in the warm water and oil and mix to a dough.","Knead for 5 minutes, then cover and rest for 30 minutes.",O(230,210,"Flour two baking trays."),"Split the dough into 4 and roll or stretch each one into a circle.","Spread with passata and sprinkle with oregano. Tear the mozzarella over the top.","!Bake for 10 to 12 minutes until bubbling and golden at the edges.","Make faces with your toppings before baking next time too!"],mx:5,bk:6,
 tip:"Leave a border round the edge with no sauce. That's the crust."},
{id:"pizza-vegan",n:"Vegan Pizzas",vn:"Vegan {x} Pizzas",a:"pizza",pk:["pizza"],keep:["vegan"],t:"savoury",lv:2,tm:"1 hr",mk:"4 pizzas",sv:4,o:"Italy",sk:"Kneading and shaping",
 intro:"Pizza dough is naturally vegan. Top it with dairy-free cheese and lots of veg.",
 i:[["strong white bread flour",300,"g"],["fast-action dried yeast",7,"g"],["salt",0.5,"tsp"],["water",200,"ml"],["olive oil",1,"tbsp"],["passata",150,"ml"],["dried oregano",1,"tsp"],["dairy-free cheese",100,"g"]],
 st:["Mix the flour, yeast and salt in a bowl.","Pour in the warm water and oil and mix to a dough.","Knead for 5 minutes, then cover and rest for 30 minutes.",O(230,210,"Flour two baking trays."),"Split the dough into 4 and stretch each into a circle.","Spread with passata, sprinkle with oregano and add the dairy-free cheese.","!Bake for 10 to 12 minutes until golden at the edges.","Cool for a minute before slicing. Cheese is lava-hot!"],mx:5,bk:6,
 tip:"Grate dairy-free cheese finely. It melts better."},
{id:"pizza-gf",n:"Gluten-free Pizzas",vn:"Gluten-free {x} Pizzas",a:"pizza",pk:["pizza"],keep:["gf"],t:"savoury",lv:2,tm:"1 hr",mk:"4 pizzas",sv:4,o:"Italy",sk:"Gluten-free baking",
 intro:"Crispy gluten-free pizzas. The dough is soft, so you spread it out with wet hands.",
 i:[["gluten-free bread flour blend",300,"g"],["xanthan gum",1,"tsp"],["fast-action dried yeast",7,"g"],["salt",0.5,"tsp"],["water",250,"ml"],["olive oil",2,"tbsp"],["passata",150,"ml"],["dried oregano",1,"tsp"],["vegetarian mozzarella",125,"g"]],
 st:["Mix the flour, xanthan gum, yeast and salt.","Add the warm water and oil and beat to a thick, sticky dough.","Cover and rest for 30 minutes.",O(230,210,"Line two trays with baking paper."),"Split into 4 and spread each into a circle with wet hands.","!Bake the bases on their own for 8 minutes.","Spread with passata, add oregano and mozzarella.","!Bake for 8 to 10 minutes more."],mx:6,bk:7,
 tip:"Baking gluten-free bases first stops them going soggy."},
{id:"pretzels",n:"Soft Pretzels",vn:"{x} Pretzels",a:"pretzel",pk:["topping"],t:"savoury",lv:3,tm:"2 hr",mk:"8 pretzels",sv:8,o:"Germany",sk:"Shaping dough",
 intro:"Twisty, salty German pretzels. A quick dip in a special bath gives them their shiny brown skin.",
 i:[["strong white bread flour",400,"g"],["fast-action dried yeast",7,"g"],["salt",1,"tsp"],["caster sugar",1,"tsp"],["water",250,"ml"],["olive oil",2,"tbsp"],["bicarbonate of soda",3,"tbsp"],["sea salt flakes",1,"tsp"]],
 st:["Mix the flour, yeast, salt and sugar. Add the warm water and oil and mix to a dough.","Knead for 8 minutes, then cover and leave for an hour.","Divide into 8. Roll each into a long snake, make a U, twist the ends together twice and fold them down onto the curve.",O(220,200,"Line two trays."),"!A grown-up brings a big pan of water to a simmer with the bicarbonate of soda, dips each pretzel in for 20 seconds and lifts it out with a slotted spoon.","Sprinkle with sea salt.","!Bake for 12 to 15 minutes until deep brown and shiny.","Eat warm."],mx:5,bk:6,
 tip:"The bicarbonate bath is what makes pretzels taste like pretzels."},
{id:"breadsticks",n:"Grissini Breadsticks",vn:"{x} Breadsticks",a:"bread",pk:["topping"],t:"savoury",lv:2,tm:"1 hr 15",mk:"16 sticks",sv:16,o:"Italy",sk:"Shaping dough",
 intro:"Long, crunchy Italian breadsticks. Perfect for dipping or pretending to be a magic wand.",
 i:[["strong white bread flour",250,"g"],["fast-action dried yeast",7,"g"],["salt",0.5,"tsp"],["olive oil",2,"tbsp"],["water",150,"ml"]],
 st:["Mix the flour, yeast and salt, add the warm water and oil and mix to a dough.","Knead for 5 minutes, then cover and rest for 30 minutes.",O(200,180,"Line two trays."),"Divide into 16 and roll each into a long, thin stick.","Lay them on the trays.","!Bake for 15 to 18 minutes until crisp and golden.","Cool on a rack. They get crunchier as they cool."],mx:4,bk:5,
 tip:"Roll from the middle outwards with flat hands to make the sticks even."},
{id:"soda",n:"Irish Soda Bread",vn:"{x} Soda Bread",a:"bread",pk:["soda"],t:"savoury",lv:1,tm:"50 min",mk:"1 loaf (8 slices)",sv:8,o:"Ireland",fe:["stpatricks"],sk:"Quick breads",
 intro:"Bread with no yeast and no kneading, ready in under an hour. It's a St Patrick's Day classic.",
 i:[["plain flour",250,"g"],["wholemeal flour",250,"g"],["bicarbonate of soda",1,"tsp"],["salt",1,"tsp"],["buttermilk",400,"ml"]],
 st:[O(200,180,"Dust a baking tray with flour."),"Mix the flours, bicarbonate of soda and salt in a big bowl.","Make a well and pour in the buttermilk. Mix quickly with a butter knife into a soft, sticky dough.","Tip onto a floured surface and shape into a round. Don't knead it, just tidy it.","!Cut a deep cross on top. In Ireland they say it lets the fairies out!","!Bake for 30 to 35 minutes until it sounds hollow when tapped underneath.","Wrap in a clean tea towel to cool so the crust stays soft."],mx:1,bk:5,
 tip:"Work fast. The bubbles start as soon as the buttermilk touches the bicarbonate."},
{id:"soda-vegan",n:"Vegan Soda Bread",vn:"Vegan {x} Soda Bread",a:"bread",pk:["soda"],keep:["vegan"],t:"savoury",lv:1,tm:"50 min",mk:"1 loaf (8 slices)",sv:8,o:"Ireland",fe:["stpatricks"],sk:"Quick breads",
 intro:"Make your own vegan 'buttermilk' with soya milk and lemon juice.",
 i:[["plain flour",250,"g"],["wholemeal flour",250,"g"],["bicarbonate of soda",1,"tsp"],["salt",1,"tsp"],["unsweetened soya milk",400,"ml"],["lemons",1,""]],
 st:[O(200,180,"Dust a baking tray with flour."),"Mix the flours, bicarbonate of soda and salt.","Squeeze the lemon juice into the soya milk and leave for 5 minutes, then pour into the flour and mix quickly to a soft dough.","Shape into a round on a floured surface.","!Cut a deep cross on top.","!Bake for 30 to 35 minutes until it sounds hollow when tapped.","Wrap in a tea towel to cool."],mx:1,bk:5,
 tip:"The lemon makes the milk sour, just like buttermilk."},
{id:"kanelbullar",n:"Swedish Cinnamon Buns",vn:"{x} Cinnamon Buns",a:"bun",pk:["bun"],t:"sweet",lv:3,tm:"2 hr 30",mk:"12 buns",sv:12,o:"Sweden",fe:["christmas"],sk:"Kneading and proving",
 intro:"Kanelbullar are so loved in Sweden that they have their own day, 4 October. These are a bigger project, so save them for a weekend.",
 i:[["milk",200,"ml"],["unsalted butter",150,"g"],["strong white bread flour",400,"g"],["fast-action dried yeast",7,"g"],["caster sugar",50,"g"],["ground cardamom",1,"tsp"],["eggs",1,""],["light brown soft sugar",75,"g"],["ground cinnamon",2,"tsp"],["pearl sugar or demerara sugar",2,"tbsp"]],
 st:["!Warm the milk with 75 g of the butter until the butter melts. It should feel warm, not hot.","In a big bowl mix the flour, yeast, caster sugar and cardamom. Pour in the milk and mix to a dough.","Knead for 10 minutes. Push, fold, turn. It gets smooth and stretchy.","Cover and leave somewhere warm for 1 hour until it doubles in size.","Mix the other 75 g soft butter with brown sugar and cinnamon. Roll the dough into a big rectangle and spread this on top.","!Roll it up like a sleeping bag and cut into 12 slices.","Put them in cases, cover, and let them grow for 30 minutes more.","Brush with beaten egg, sprinkle with pearl sugar, and bake at 200°C (180°C fan) for 12 to 15 minutes."],mx:4,bk:7,
 tip:"Yeast is alive! Too hot and it stops working, so keep the milk just warm."},
{id:"hotcross",n:"Hot Cross Buns",vn:"{x} Hot Cross Buns",a:"hotcross",pk:["bun"],t:"sweet",lv:3,tm:"3 hr",mk:"12 buns",sv:12,o:"United Kingdom",se:["spring"],fe:["easter"],sk:"Kneading and proving",
 intro:"Spiced, fruity buns with a cross on top, eaten around Easter, especially on Good Friday.",
 i:[["milk",250,"ml"],["unsalted butter",50,"g"],["strong white bread flour",500,"g"],["fast-action dried yeast",7,"g"],["caster sugar",75,"g"],["salt",1,"tsp"],["mixed spice",2,"tsp"],["eggs",1,""],["sultanas",100,"g"],["oranges",1,""],["plain flour",75,"g"],["apricot jam",2,"tbsp"]],
 st:["!Warm the milk and butter until the butter melts. Let it cool until just warm.","Mix the bread flour, yeast, sugar, salt and spice in a big bowl.","Add the milk and egg and mix to a soft dough.","Knead for 10 minutes until smooth.","Cover and leave somewhere warm for an hour until doubled.","Knead in the sultanas and grated orange zest.","Shape into 12 balls and put them on a lined tray, close together.","Cover and leave for 45 minutes to puff up.",O(220,200),"Mix the plain flour with 5 to 6 tablespoons of water to a thick paste and pipe crosses over the buns.","!Bake for 15 to 20 minutes until golden.","!Warm the jam and brush it over the hot buns so they shine."],mx:5,bk:10,
 tip:"Buns baked close together stay soft at the sides."},
{id:"lussekatter",n:"Saffron Lucia Buns",vn:"{x} Lucia Buns",a:"bun",pk:[],t:"sweet",lv:3,tm:"2 hr 30",mk:"12 buns",sv:12,o:"Sweden",se:["winter"],fe:["stlucia","christmas"],sk:"Shaping dough",
 intro:"On St Lucia's Day, 13 December, Swedish children dress in white and bake these golden S-shaped saffron buns called lussekatter.",
 i:[["milk",250,"ml"],["unsalted butter",75,"g"],["saffron threads",1,"pinch"],["strong white bread flour",500,"g"],["fast-action dried yeast",7,"g"],["caster sugar",75,"g"],["salt",0.5,"tsp"],["eggs",2,""],["raisins",20,"g"]],
 st:["!Warm the milk and butter until the butter melts. Crumble in the saffron and leave for 10 minutes to turn golden.","Mix the flour, yeast, sugar and salt. Add the warm milk and one egg and mix to a dough.","Knead for 10 minutes, then cover and leave for an hour until doubled.","Roll into 12 snakes and curl each end in opposite directions to make an S shape.","Push a raisin into the middle of each curl.","Cover and leave for 30 minutes.",O(200,180),"Brush with the other egg, beaten.","!Bake for 10 to 12 minutes until golden."],mx:4,bk:8,
 tip:"Saffron is the world's most expensive spice. A tiny pinch is all you need."},
{id:"challah",n:"Round Challah",vn:"{x} Challah",a:"bread",pk:[],t:"sweet",lv:3,tm:"3 hr",mk:"1 loaf",sv:10,cu:"Jewish baking tradition",se:["autumn"],fe:["roshhashanah"],sk:"Shaping dough",
 intro:"A soft, golden bread. At Rosh Hashanah it's coiled into a round to show the circle of the year. It has no dairy, so it can be eaten with any meal.",
 i:[["strong white bread flour",500,"g"],["fast-action dried yeast",7,"g"],["salt",1,"tsp"],["caster sugar",50,"g"],["honey",3,"tbsp"],["eggs",3,""],["sunflower oil",80,"ml"],["water",175,"ml"]],
 st:["Mix the flour, yeast, salt and sugar.","Whisk the honey, 2 eggs, oil and warm water and pour into the flour. Mix to a soft dough.","Knead for 10 minutes until smooth and silky.","Cover and leave for 1 to 2 hours until doubled.","Roll into one long rope and coil it into a spiral, like a snail shell.","Put on a lined tray, cover and leave for 45 minutes.",O(180,160),"Brush with the last egg, beaten.","!Bake for 25 to 30 minutes until deep golden and hollow-sounding."],mx:4,bk:8,
 tip:"Brush the egg glaze into all the cracks for a shiny, golden loaf."},
{id:"stollen",n:"Stollen Bites",vn:"{x} Stollen Bites",a:"dome",pk:[],t:"sweet",lv:2,tm:"45 min",mk:"24 bites",sv:24,o:"Germany",se:["winter"],fe:["christmas"],sk:"Shaping and filling",
 intro:"Germany's fruity Christmas bread with a marzipan middle. These quick bites don't need yeast.",
 i:[["self-raising flour",250,"g"],["ground almonds",75,"g"],["caster sugar",75,"g"],["unsalted butter",100,"g"],["mixed dried fruit",150,"g"],["eggs",1,""],["ricotta",175,"g"],["marzipan",100,"g"],["icing sugar",50,"g"]],
 st:[O(180,160,"Line a baking tray."),"Rub 75 g of the butter into the flour, almonds and sugar, then stir in the dried fruit.","Beat the egg with the ricotta, pour in and mix to a soft dough.","Cut the marzipan into 24 small cubes.","Wrap a little ball of dough around each marzipan cube and put them on the tray.","!Bake for 15 to 18 minutes until golden.","!Melt the rest of the butter, brush it over the warm bites and roll them in icing sugar like snowballs."],mx:2,bk:5,
 tip:"Stollen is shaped to look like a baby wrapped in a blanket."},
/* ---------- Pastry ---------- */
{id:"jamtarts",n:"Jam Tarts",vn:"{x} Tarts",a:"tart",pk:["tartfill"],fill:"strawberry jam",t:"sweet",lv:1,tm:"45 min",mk:"12 tarts",sv:12,o:"United Kingdom",sk:"Making pastry",
 intro:"In the old nursery rhyme, the Queen of Hearts made some tarts. Now you can too!",
 i:[["plain flour",175,"g"],["unsalted butter",85,"g"],["caster sugar",1,"tbsp"],["water",3,"tbsp"],["strawberry jam",4,"tbsp"]],
 st:[O(200,180,"Grease a 12-hole bun tin."),"Rub the cold butter into the flour until it looks like breadcrumbs, then stir in the sugar.","Add the cold water a spoonful at a time and bring it together into a dough.","Roll out to the thickness of a coin. Cut 12 circles and press them into the tin.","Put a heaped teaspoon of filling into each one. Not too full, or it bubbles over!","!Bake for 12 to 15 minutes until the pastry is golden.","!The filling is lava-hot. Leave to cool for 20 minutes before tasting."],mx:3,bk:5,
 tip:"Cold hands and cold butter make the crumbliest pastry."},
{id:"jamtarts-vegan",n:"Vegan Jam Tarts",vn:"Vegan {x} Tarts",a:"tart",pk:["tartfill"],fill:"strawberry jam",keep:["vegan"],t:"sweet",lv:1,tm:"45 min",mk:"12 tarts",sv:12,o:"United Kingdom",sk:"Making pastry",
 intro:"Crumbly pastry made with a dairy-free block. Most jam is vegan already.",
 i:[["plain flour",175,"g"],["dairy-free baking block",85,"g"],["caster sugar",1,"tbsp"],["water",3,"tbsp"],["strawberry jam",4,"tbsp"]],
 st:[O(200,180,"Grease a 12-hole bun tin."),"Rub the cold dairy-free block into the flour, then stir in the sugar.","Add cold water a spoonful at a time and bring it together.","Roll out, cut 12 circles and press into the tin.","Put a heaped teaspoon of filling into each one.","!Bake for 12 to 15 minutes until golden.","!Cool for 20 minutes before tasting."],mx:3,bk:5,
 tip:"If the pastry tears, just press it back together in the tin."},
{id:"jamtarts-gf",n:"Gluten-free Jam Tarts",vn:"Gluten-free {x} Tarts",a:"tart",pk:["tartfill"],fill:"strawberry jam",keep:["gf"],t:"sweet",lv:2,tm:"50 min",mk:"12 tarts",sv:12,o:"United Kingdom",sk:"Making pastry",
 intro:"Gluten-free pastry with an egg to hold it together.",
 i:[["gluten-free plain flour blend",175,"g"],["xanthan gum",0.5,"tsp"],["unsalted butter",85,"g"],["caster sugar",1,"tbsp"],["eggs",1,""],["strawberry jam",4,"tbsp"]],
 st:[O(200,180,"Grease a 12-hole bun tin."),"Rub the butter into the flour and xanthan gum, then stir in the sugar.","Add the beaten egg and bring together into a dough. Chill for 15 minutes.","Roll out between baking paper, cut 12 circles and press into the tin.","Put a heaped teaspoon of filling into each one.","!Bake for 12 to 15 minutes until golden.","!Cool for 20 minutes before tasting."],mx:3,bk:5,
 tip:"Rolling between two sheets of baking paper stops gluten-free pastry from cracking."},
{id:"mincepies",n:"Mince Pies",vn:"{x} Mince Pies",a:"pie",pk:[],t:"sweet",lv:2,tm:"1 hr",mk:"12 pies",sv:12,o:"United Kingdom",se:["winter"],fe:["christmas"],sk:"Making pastry",
 intro:"Little fruity, spicy pies for Christmas. Look for 'vegetarian' on the mincemeat jar, because traditional mincemeat used beef fat.",
 i:[["plain flour",225,"g"],["unsalted butter",125,"g"],["caster sugar",1,"tbsp"],["water",3,"tbsp"],["vegetarian mincemeat",300,"g"],["milk",1,"tbsp"],["icing sugar",1,"tbsp"]],
 st:[O(200,180,"Grease a 12-hole bun tin."),"Rub the cold butter into the flour, stir in the sugar and add cold water to make a dough.","Roll out and cut 12 large circles for the bottoms and 12 stars for the lids.","Press the circles into the tin and fill each with a heaped teaspoon of mincemeat.","Top with the stars and brush with a little milk.","!Bake for 15 to 20 minutes until golden.","Cool, then dust with icing sugar."],mx:3,bk:5,
 tip:"There's no meat in vegetarian mincemeat, just dried fruit, apples and spices."},
{id:"quiche",n:"Mini Veggie Quiches",vn:"Mini {x} Quiches",a:"quiche",pk:["sav"],t:"savoury",lv:2,tm:"1 hr",mk:"12 quiches",sv:12,o:"France",sk:"Making pastry",
 intro:"Little French tarts with a soft, cheesy egg filling. Great for picnics.",
 i:[["plain flour",175,"g"],["unsalted butter",85,"g"],["water",3,"tbsp"],["eggs",3,""],["milk",150,"ml"],["vegetarian mature cheddar",75,"g"]],
 st:[O(200,180,"Grease a 12-hole bun tin."),"Rub the cold butter into the flour and add cold water to make a dough.","Roll out, cut 12 circles and press them into the tin.","!Grate the cheese. Whisk the eggs and milk in a jug and stir in the cheese.","Divide any fillings between the cases, then pour in the egg mix until nearly full.","!Bake for 18 to 20 minutes until puffed and set.","Cool for 10 minutes before lifting out."],mx:3,bk:5,
 tip:"Pour the egg mix slowly from a jug so it doesn't overflow."},
{id:"quiche-gf",n:"Gluten-free Mini Quiches",vn:"Gluten-free Mini {x} Quiches",a:"quiche",pk:["sav"],keep:["gf"],t:"savoury",lv:2,tm:"1 hr",mk:"12 quiches",sv:12,o:"France",sk:"Making pastry",
 intro:"Mini quiches with gluten-free pastry.",
 i:[["gluten-free plain flour blend",175,"g"],["xanthan gum",0.5,"tsp"],["unsalted butter",85,"g"],["eggs",4,""],["milk",150,"ml"],["vegetarian mature cheddar",75,"g"]],
 st:[O(200,180,"Grease a 12-hole bun tin."),"Rub the butter into the flour and xanthan gum, add one beaten egg and bring into a dough. Chill for 15 minutes.","Roll out between baking paper, cut 12 circles and press into the tin.","!Grate the cheese. Whisk the other 3 eggs with the milk and stir in the cheese.","Divide any fillings between the cases, then pour in the egg mix.","!Bake for 18 to 20 minutes until set.","Cool for 10 minutes before lifting out."],mx:3,bk:5,
 tip:"Mini quiches freeze well for lunchboxes."},
{id:"pufftarts",n:"Puff Pastry Tarts",vn:"{x} Puff Tarts",a:"pastry",pk:["pizza"],t:"savoury",lv:1,tm:"30 min",mk:"6 tarts",sv:6,o:"France",sk:"Using pastry",
 intro:"Ready-made puff pastry puffs up into crispy layers around your favourite toppings.",
 i:[["ready-rolled puff pastry",1,"sheet"],["tomato purée",2,"tbsp"],["dried oregano",0.5,"tsp"],["vegetarian mozzarella",100,"g"],["milk",1,"tbsp"]],
 st:[O(200,180,"Line a baking tray."),"Unroll the pastry and cut it into 6 rectangles.","Score a border 1 cm in from the edge of each. Don't cut all the way through!","Spread the tomato purée inside the borders and sprinkle with oregano.","Tear the mozzarella over and brush the borders with milk.","!Bake for 15 to 18 minutes until puffed and golden."],mx:3,bk:5,
 tip:"Keep puff pastry cold until you use it. That's how it gets its layers."},
{id:"pufftarts-vegan",n:"Vegan Hummus Puff Tarts",vn:"Vegan {x} Puff Tarts",a:"pastry",pk:["pizza"],keep:["vegan"],t:"savoury",lv:1,tm:"30 min",mk:"6 tarts",sv:6,o:"France",sk:"Using pastry",
 intro:"Crispy pastry with a creamy hummus base. Check the pastry label: most supermarket puff pastry is vegan.",
 i:[["ready-rolled puff pastry",1,"sheet"],["hummus",4,"tbsp"],["olive oil",1,"tbsp"],["unsweetened soya milk",1,"tbsp"]],
 st:[O(200,180,"Line a baking tray."),"Unroll the pastry and cut it into 6 rectangles.","Score a border 1 cm in from the edge of each.","Spread hummus inside the borders.","Drizzle with oil and brush the borders with soya milk.","!Bake for 15 to 18 minutes until puffed and golden."],mx:3,bk:5,
 tip:"Hummus is made from chickpeas and sesame paste, called tahini."},
{id:"cheesestraws",n:"Cheese Straws",vn:"{x} Cheese Straws",a:"pastry",pk:["straw"],t:"savoury",lv:1,tm:"30 min",mk:"20 straws",sv:20,o:"United Kingdom",fe:["fathersday","christmas"],sk:"Using pastry",
 intro:"Twisty, cheesy, crunchy. Perfect for parties and for saying thank you to someone special.",
 i:[["ready-rolled puff pastry",1,"sheet"],["vegetarian mature cheddar",75,"g"],["eggs",1,""]],
 st:[O(200,180,"Line a baking tray."),"!Grate the cheese finely.","Unroll the pastry and brush it with beaten egg.","Sprinkle the cheese over half the pastry.","Fold the other half over the top, press down and roll gently with a rolling pin.","Cut into 1.5 cm strips and twist each one like a corkscrew.","!Bake for 12 to 15 minutes until golden and crisp."],mx:3,bk:6,
 tip:"Twist the straws on the tray so they don't untwist when you move them."},
{id:"pinwheels",n:"Pizza Pinwheels",vn:"{x} Pinwheels",a:"pastry",pk:["straw"],t:"savoury",lv:1,tm:"35 min",mk:"16 pinwheels",sv:16,o:"Italy",sk:"Using pastry",
 intro:"All the taste of pizza, rolled up into swirls.",
 i:[["ready-rolled puff pastry",1,"sheet"],["tomato purée",3,"tbsp"],["vegetarian mature cheddar",75,"g"],["dried oregano",0.5,"tsp"],["milk",1,"tbsp"]],
 st:[O(200,180,"Line a baking tray."),"Unroll the pastry and spread it with tomato purée.","!Grate the cheese and sprinkle it over with the oregano.","Roll up tightly from one long side like a sleeping bag. Chill for 10 minutes.","!Slice into 16 pinwheels and lay them flat on the tray.","Brush with a little milk.","!Bake for 15 minutes until golden."],mx:2,bk:6,
 tip:"Chilling the roll first makes it much easier to slice neatly."},
{id:"veggierolls",n:"Veggie Sausage Rolls",vn:"{x} Veggie Sausage Rolls",a:"pastry",pk:["roll"],keep:["vegan"],t:"savoury",lv:2,tm:"50 min",mk:"12 rolls",sv:12,o:"United Kingdom",fe:["christmas","fathersday"],sk:"Using pastry",
 intro:"No meat at all! The filling is chickpeas, carrot and herbs, and it's vegan too.",
 i:[["ready-rolled puff pastry",1,"sheet"],["tinned chickpeas",1,"tin"],["carrots",1,""],["dried breadcrumbs",50,"g"],["dried sage",1,"tsp"],["smoked paprika",0.5,"tsp"],["olive oil",1,"tbsp"],["unsweetened soya milk",1,"tbsp"]],
 st:[O(200,180,"Line a baking tray."),"Drain and rinse the chickpeas, then mash them in a bowl.","!Grate the carrot into the bowl and add the breadcrumbs, sage, paprika and oil. Squish it all together.","Cut the pastry in half lengthways and spoon a sausage of filling along each strip.","Roll the pastry over and press the edges with a fork to seal.","!Cut each into 6 rolls, brush with soya milk and snip the tops with scissors.","!Bake for 20 to 25 minutes until golden."],mx:2,bk:6,
 tip:"Pat the chickpeas dry after rinsing so the filling isn't soggy."},
{id:"galette",n:"Galette des Rois",vn:"{x} Galette des Rois",a:"pie",pk:[],t:"sweet",lv:3,tm:"1 hr",mk:"8 slices",sv:8,o:"France",se:["winter"],fe:["epiphany"],sk:"Using pastry",
 intro:"The French 'kings' cake' for Epiphany on 6 January. A treasure is hidden inside, and whoever finds it is king or queen for the day!",
 i:[["ready-rolled puff pastry",2,"sheet"],["unsalted butter",50,"g"],["caster sugar",50,"g"],["ground almonds",75,"g"],["eggs",2,""],["whole almonds",1,""]],
 st:[O(200,180,"Line a baking tray."),"Beat the soft butter and sugar, then beat in the ground almonds and one egg to make a creamy filling.","Cut a 22 cm circle from each pastry sheet. Put one on the tray.","Spread the filling on, leaving a 2 cm border, and hide one whole almond in it. Tell everyone it's there so nobody bites it by surprise!","Brush the border with beaten egg, lay the second circle on top and press the edges together.","Brush the top with egg and draw a pattern with the back of a knife.","!Bake for 25 to 30 minutes until deep golden.","Make a paper crown for whoever finds the almond!"],mx:3,bk:6,
 tip:"In France the youngest child sits under the table and calls out who gets each slice."},
{id:"turnovers",n:"Apple Turnovers",vn:"{x} Turnovers",a:"pastry",pk:["fruitfill"],fill:"eating apples",keep:["vegan"],t:"sweet",lv:1,tm:"40 min",mk:"4 turnovers",sv:4,o:"United Kingdom",se:["autumn"],sk:"Using pastry",
 intro:"Fruity triangles of crispy pastry. Most ready-made puff pastry is vegan, so these are too.",
 i:[["ready-rolled puff pastry",1,"sheet"],["eating apples",2,""],["caster sugar",1,"tbsp"],["ground cinnamon",0.5,"tsp"],["unsweetened soya milk",1,"tbsp"],["demerara sugar",1,"tbsp"]],
 st:[O(200,180,"Line a baking tray."),"!Get the fruit ready: peel, core and chop it small (berries can go in whole).","Mix the fruit with the caster sugar and cinnamon.","Cut the pastry into 4 squares. Spoon fruit onto one corner of each.","Fold over into triangles and press the edges with a fork to seal.","!Brush with soya milk, sprinkle with demerara sugar and cut a little slit in the top.","!Bake for 20 minutes until puffed and golden."],mx:2,bk:6,
 tip:"Don't overfill them, or the juice leaks out."},
{id:"rugelach",n:"Rugelach",vn:"{x} Rugelach",a:"crescent",pk:[],t:"sweet",lv:3,tm:"1 hr 30",mk:"16 pastries",sv:16,cu:"Jewish baking tradition",se:["winter"],fe:["hanukkah"],sk:"Rolling and shaping",
 intro:"Little rolled crescents with a jammy, cinnamon filling, loved by Jewish families and often shared at Hanukkah.",
 i:[["plain flour",150,"g"],["unsalted butter",115,"g"],["cream cheese",115,"g"],["apricot jam",4,"tbsp"],["caster sugar",2,"tbsp"],["ground cinnamon",1,"tsp"],["raisins",40,"g"]],
 st:["Mix the flour, soft butter and cream cheese into a soft dough. Wrap and chill for 1 hour.",O(180,160,"Line a baking tray."),"Mix the sugar and cinnamon. Roll the dough into a big circle.","Spread with jam and sprinkle with cinnamon sugar and raisins.","!Cut into 16 triangles, like a pizza.","Roll each one up from the wide end to make a crescent.","!Bake for 20 to 25 minutes until golden."],mx:3,bk:6,
 tip:"Rugelach means 'little twists' in Yiddish."},
{id:"gujiya",n:"Baked Gujiya",vn:"{x} Gujiya",a:"crescent",pk:[],t:"sweet",lv:3,tm:"1 hr",mk:"12 gujiya",sv:12,o:"India",se:["spring"],fe:["holi","diwali"],sk:"Shaping and filling",
 intro:"Crescent-shaped pastries filled with coconut and raisins, eaten at Holi. They're usually fried, so this baked version is safer for young cooks.",
 i:[["plain flour",200,"g"],["unsalted butter",50,"g"],["water",6,"tbsp"],["desiccated coconut",75,"g"],["raisins",30,"g"],["caster sugar",40,"g"],["ground cardamom",0.5,"tsp"],["pistachios",25,"g"],["milk",2,"tbsp"]],
 st:["!Melt the butter, rub it into the flour and add water a spoon at a time to make a firm dough. Rest for 20 minutes.","!Chop the pistachios. Mix with the coconut, raisins, sugar and cardamom.",O(180,160,"Line a tray."),"Roll the dough thin and cut 10 cm circles.","Put a spoonful of filling on one half, wet the edge, fold over and press shut. Pinch or fork the edge for a pattern.","Brush with milk.","!Bake for 20 to 25 minutes until golden."],mx:1,bk:6,

{id:"pineappletarts",n:"Pineapple Tarts",vn:"{x} Pineapple Tarts",a:"tart",pk:[],t:"sweet",lv:3,tm:"2 hr",mk:"24 tarts",sv:24,cu:"Malaysian & Singaporean baking",se:["winter"],fe:["lunarny"],sk:"Making pastry",

{id:"mooncakes",n:"Red Bean Mooncake Bites",vn:"{x} Mooncake Bites",a:"dome",pk:[],t:"sweet",lv:3,tm:"1 hr 15",mk:"16 bites",sv:16,o:"China",se:["autumn"],fe:["midautumn"],sk:"Shaping and filling",

{id:"crumble-ls",n:"Low-sugar Oaty Crumble",vn:"Low-sugar {x} Crumble",a:"crumble",pk:["fruitfill"],fill:"eating apples",keep:["lowsugar"],t:"sweet",lv:1,tm:"1 hr",mk:"6 portions",sv:6,o:"United Kingdom",se:["autumn"],sk:"Low-sugar baking",

{id:"brownies",n:"Gooey Brownies",vn:"{x} Brownies",a:"brownie",pk:["brownie"],t:"sweet",lv:2,tm:"50 min",mk:"16 squares",sv:16,o:"United States",sk:"Melting method",

{id:"brownies-vegan",n:"Vegan Brownies",vn:"Vegan {x} Brownies",a:"brownie",pk:["brownie"],keep:["vegan"],t:"sweet",lv:1,tm:"45 min",mk:"16 squares",sv:16,o:"United States",sk:"Vegan baking",

{id:"brownies-gf",n:"Gluten-free Brownies",vn:"Gluten-free {x} Brownies",a:"brownie",pk:["brownie"],keep:["gf"],t:"sweet",lv:2,tm:"50 min",mk:"16 squares",sv:16,o:"United States",sk:"Gluten-free baking",

{id:"pancakes-vegan",n:"Vegan Fluffy Pancakes",vn:"Vegan {x} Pancakes",a:"pancake",pk:["pancake"],keep:["vegan"],t:"sweet",lv:2,tm:"30 min",mk:"10 pancakes",sv:10,o:"United States",fe:["pancakeday"],sk:"Vegan baking",

{id:"pancakes-banana",n:"Banana Oat Pancakes",vn:"{x} Banana Oat Pancakes",a:"pancake",pk:["pancake"],keep:["gf","lowsugar"],t:"sweet",lv:1,tm:"20 min",mk:"10 small pancakes",sv:5,o:"United Kingdom",sk:"Low-sugar baking",

{id:"ciambella",n:"Lemon Ciambella",vn:"{x} Ciambella",a:"ring",pk:["ring"],t:"sweet",lv:1,tm:"55 min",mk:"10 slices",sv:10,o:"Italy",sk:"Whisking",

{id:"madeleines",n:"Little Madeleines",vn:"{x} Madeleines",a:"madeleine",pk:["madeleine"],t:"sweet",lv:2,tm:"1 hr",mk:"16 cakes",sv:16,o:"France",sk:"Resting batter",

{id:"linzer",n:"Linzer Jam Hearts",vn:"{x} Linzer Hearts",a:"linzer",pk:["tartfill"],fill:"raspberry jam",t:"sweet",lv:2,tm:"1 hr 15",mk:"12 biscuits",sv:12,o:"Austria",fe:["valentines","mothersday","christmas"],sk:"Rolling and cutting",

const TARGET=1008;
const LEVEL=["","easy","medium","challenge"];
const SOFT=["var(--berry-soft)","var(--mango-soft)","var(--sky-soft)","var(--mint-soft)"];
function roundQty(q,u){
  if(q===0)return 0;
  if(u==="g"||u==="ml")return q>=20?Math.round(q/5)*5:Math.round(q);
  if(u==="tsp"||u==="tbsp")return Math.max(0.25,Math.round(q*4)/4);
  return Math.max(1,Math.round(q));
}
function addIng(list,name,qty,unit){
  const hit=list.find(x=>x.name===name&&x.unit===unit);
  if(hit){hit.qty=roundQty(hit.qty+qty,unit);}
  else list.push({name,qty:roundQty(qty,unit),unit});
}
function analyse(ing,sv){
  let vegan=true,gf=true,sugar=0;const al=new Set(),notes=new Set();
  ing.forEach(x=>{
    const d=ING[x.name];if(!d)throw new Error("Unknown ingredient: "+x.name);
    if(!d.f.includes("v"))vegan=false;
    if(!d.f.includes("g"))gf=false;
    for(const c of d.f)if(ALLERGEN[c])al.add(ALLERGEN[c]);
    if(d.f.includes("c"))notes.add("cheese");
    if(x.name==="vegetarian mincemeat")notes.add("mincemeat");
    if(x.name==="gel food colouring")notes.add("colour");
    if(d.s){const g=x.unit==="tbsp"?x.qty*d.tb:x.unit==="tsp"?x.qty*d.tb/3:(x.unit==="g"||x.unit==="ml")?x.qty:0;sugar+=g*d.s;}
  });
  const per=sv?sugar/sv:sugar;
  return {vegan,gf,lowsugar:per<=5,sugar:Math.round(per*10)/10,nutfree:!al.has("nuts")&&!al.has("peanuts"),allergens:[...al],notes:[...notes]};
}
function makeRecipe(b,p){
  let ing=b.i.map(([n,q,u])=>({name:n,qty:q,unit:u}));
  if(p&&p.f){
    if(!b.fill)return null;
    if(p.f.length===1&&p.f[0][0]===b.fill)return null;
    const base=ing.find(x=>x.name===b.fill);ing=ing.filter(x=>x.name!==b.fill);
    p.f.forEach(([n,fac,u])=>addIng(ing,n,base.qty*fac,u===undefined?base.unit:u));
  }
  if(p&&p.i)p.i.forEach(([n,q,u])=>addIng(ing,n,q,u));
  let steps=b.st.slice();
  if(p){
    const pre=p.pb?[p.pb]:[];
    if(p.m)steps.splice(b.mx+1,0,p.m);
    const bk=b.bk+(p.m&&b.mx<b.bk?1:0);
    if(pre.length)steps.splice(bk,0,...pre);
    if(p.tp)steps.push(p.tp);
  }
  const an=analyse(ing,b.sv);
  if(p&&b.keep&&b.keep.some(k=>!an[k]))return null;
  const se=(p&&p.se)||b.se||[];
  const fe=[...new Set([...(b.fe||[]),...((p&&p.fe)||[])])];
  const name=p?b.vn.replace("{x}",p.x):b.n;
  return {id:p?b.id+"~"+p.k:b.id,base:b.id,isBase:!p,name,country:b.o||null,culture:b.cu||null,
    level:LEVEL[b.lv],time:b.tm,makes:b.mk,sv:b.sv,skill:b.sk,type:b.t,art:b.a,accent:p?p.c:null,
    colour:SOFT[(b.id.length+(p?p.k.length:0))%4],intro:b.intro,tip:b.tip,
    ing:ing.map(x=>Object.assign(x,{aisle:AISLES[ING[x.name].a]||"Other bits"})),
    steps:steps.map(t=>({t:t.replace(/^!/,""),g:t.startsWith("!")})),
    seasons:se,festivals:fe,...an};
}
function buildLibrary(){
  const bases=[],vars=[];
  BASES.forEach(b=>{
    const r=makeRecipe(b,null);
    if(b.keep)b.keep.forEach(k=>{if(!r[k])throw new Error(b.id+" fails its own label "+k);});
    bases.push(r);
    const list=[];
    (b.pk||[]).forEach(g=>(PACKS[g]||[]).forEach(p=>{
      if(p.no&&p.no.includes(b.id))return;
      if(b.n.toLowerCase().includes(p.x.toLowerCase()))return;
      const v=makeRecipe(b,p);if(v)list.push(v);
    }));
    const bfe=(b.fe||[]).length,key=r=>r.festivals.length>bfe?0:1,rot=(BASES.indexOf(b)*5)%(list.length||1);
    const rl=list.slice(rot).concat(list.slice(0,rot));rl.sort((x,y)=>key(x)-key(y));list.length=0;list.push(...rl);
    vars.push(list);
  });
  const need=TARGET-bases.length,picked=[];
  for(let round=0;picked.length<need;round++){
    let any=false;
    for(const list of vars){if(list[round]){picked.push(list[round]);any=true;if(picked.length>=need)break;}}
    if(!any)break;
  }
  return {all:bases.concat(picked),available:bases.length+vars.reduce((a,l)=>a+l.length,0),bases:bases.length};
}

 {t:"Allergies are serious",col:"var(--mango-soft)",b:["The UK has 14 main allergens: celery, cereals with gluten, crustaceans, eggs, fish, lupin, milk, molluscs, mustard, tree nuts, peanuts, sesame, soya and sulphites.","Always tell people what's in your bakes, and check before sharing.","Use clean bowls and spoons for allergy-friendly bakes.","If someone's lips swell or they struggle to breathe, call 999 straight away."]},

const CAPTURE=[
 {t:"Light is everything",col:"var(--mango-soft)",b:["Take photos near a window in daylight. It's the best light there is, and it's free!","Switch the flash off. It makes food look shiny and flat.","If shadows are too dark, hold up a sheet of white paper on the other side to bounce light back."]},
 {t:"Find your angle",col:"var(--sky-soft)",b:["Flat things like cookies and pizza look great from straight above. This is called a flat lay.","Tall things like cupcakes and layer cakes look best from the side, at table height.","Get close to show texture: crumbs, bubbles, drips of icing.","Cut a slice and photograph the inside. That's where the story is!"]},

const BIZ_STEPS=[
 {t:"1. Start small: a bake sale stall",col:"var(--mango-soft)",b:["The best first business is a stall at the village fête, a school fair or a coffee morning in the village hall, with a grown-up in charge.","A one-off bake sale for a school or charity usually doesn't need registering as a food business. If you start selling regularly, it does. If in doubt, ask Somerset Council.","Decide where the money goes: a charity, a school trip or your savings."]},
 {t:"2. Know your village",col:"var(--sky-soft)",b:["Who lives nearby? Families, walkers, farm workers, people at the pub quiz or the cricket club?","What's missing? Maybe nobody sells gluten-free or vegan treats, or fresh bread at weekends.","Use Somerset ingredients and say so: Somerset apples in autumn, vegetarian Cheddar in cheese scones, and strawberries from the Cheddar valley in summer."]},
 {t:"3. The rules for a real food business",col:"var(--berry-soft)",b:["Register with Somerset Council at least 28 days before you start selling. Home kitchens and market stalls count too. Registering is free.","If you're under 18, a parent or guardian needs to register and be responsible for the business.","The council may inspect the kitchen and give it a food hygiene rating from 0 to 5. Ratings appear on the Food Standards Agency website.","A Food Hygiene Level 2 certificate (often done online) is a good way to show you know how to prepare food safely.","You must tell customers about the 14 allergens. Food packed before it's sold from the same place (prepacked for direct sale) needs a label with its name and full ingredients, with allergens in bold. This is Natasha's Law, which started on 1 October 2021.","Talk to an insurer about public and product liability insurance."]},
 {t:"4. Money and tax",col:"var(--mint-soft)",b:["Keep a notebook or spreadsheet of everything you spend and everything you earn.","In the UK, the first £1,000 a year of trading income is covered by the trading allowance, so you usually don't need to tell HMRC. You must still keep records.","If you earn more than £1,000 a year, you need to register for Self Assessment.","Use the Maths Lab to work out your costs, prices and profit."]},
 {t:"5. Your stall",col:"var(--mango-soft)",b:["Give your business a name and make a bright sign.","Price labels on everything, plus a card listing allergens for every bake.","Cover food, use tongs or napkins, and bring hand gel.","Bring a cash float (coins for change) and, with a grown-up, a card reader if you can.","Smile, say hello and tell people about your bakes. You're the best advert!"]},
 {t:"6. Grow it",col:"var(--sky-soft)",b:["Ask customers what they liked and write it in your journal.","Take orders for birthdays and village events.","Ask the village shop or café if they'd like to sell your bakes. They'll need to see your registration and hygiene rating.","Try a seasonal special for every festival in the calendar."]}
];

/* ---------- Planner ---------- */
function shoppingItems(w){
  const map=new Map();
  w.sessions.forEach(s=>{const r=getR(s.recipe);if(!r)return;const x=s.x||1;r.ing.forEach(g=>{if(g.name==="water")return;const k=g.name+"|"+g.unit;if(!map.has(k))map.set(k,{key:k,name:g.name,unit:g.unit,qty:0,aisle:g.aisle,for:[]});const e=map.get(k);e.qty+=g.qty*x;if(!e.for.includes(r.name))e.for.push(r.name);});});
  return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name));
}

    :`<div class="emptyslot"><p>No recipe yet.</p><div class="btnrow"><button class="btn mango" data-a="pick" data-slot="${i}">Choose a recipe</button><button class="btn small" data-a="slotsurprise" data-slot="${i}">${icon("dice")} Surprise me</button></div></div>`}

  <div class="card" id="shop" style="display:grid;gap:16px">

/* ---------- Recipe Book ---------- */
function filtered(){
  const q=RB.q.trim().toLowerCase();
  return allRecipes().filter(r=>{
    if(RB.mine&&!r.isCustom)return false;
    if(RB.vegan&&!r.vegan)return false;
    if(RB.gf&&!r.gf)return false;
    if(RB.ls&&!r.lowsugar)return false;
    if(RB.nf&&!r.nutfree)return false;
    if(RB.type!=="all"&&r.type!==RB.type)return false;
    if(RB.level!=="all"&&r.level!==RB.level)return false;
    if(RB.season!=="any"&&!r.seasons.includes(RB.season))return false;
    if(RB.fest&&!r.festivals.includes(RB.fest))return false;
    if(q&&!(r.name.toLowerCase().includes(q)||origin(r).toLowerCase().includes(q)||r.ing.some(i=>i.name.toLowerCase().includes(q))))return false;
    return true;
  });
}

  if(r.notes.includes("cheese"))notes.push("Cheese: choose one marked 'suitable for vegetarians'. Some cheese, like real Parmesan, is made with animal rennet.");

function parseMins(t){if(!t)return 60;let m=0;const h=t.match(/(\d+)\s*hr/);if(h)m+=60*+h[1];const mm=t.match(/(\d+)\s*min/);if(mm)m+=+mm[1];const tail=t.match(/hr\s*(\d+)$/);if(tail)m+=+tail[1];return m||60;}
function money(n){return isFinite(n)?"£"+(Math.round(n*100)/100).toFixed(2):"–";}
function defaultCost(){return {items:12,pack:0.05,price:1.5,fee:10,rows:[["Butter",2.2,250,100],["Caster sugar",1.1,1000,100],["Eggs",2.4,6,2],["Self-raising flour",0.9,1000,100],["Icing sugar",1.2,500,150],["Sprinkles",1.0,100,15],["Cupcake cases",1.0,50,12]]};}
function mathsView(){

  const breakEven=profitItem>0?Math.ceil((+C.fee||0)/profitItem):null;
  const [pa,sa]=MATH.packA,[pb,sb]=MATH.packB;const kgA=pa/sa*1000,kgB=pb/sb*1000;
  const hyd=MATH.dough?Math.round(MATH.water/MATH.dough*100):0;
  return `<div class="section">${back}
  <div><div class="eyebrow">Maths Lab</div><h2>Baking is maths you can eat</h2><p style="font-weight:700;max-width:62ch">Fractions, ratios, time, money and percentages all live in your kitchen. Try each machine below.</p></div>

    <p class="muted small">The recipe makes ${esc(r.makes)} (${r.sv} portions). Multiplier: <b>${Math.round(x*100)/100}</b></p>
    <ul class="ing">${r.ing.filter(g=>g.name!=="water").map(g=>`<li><span>${esc(g.name)}</span><b>${fmtQty(g.qty*x,g.unit)}</b></li>`).join("")}</ul></div>
  <div class="card mathcard"><h3>2. The magic 1 : 2 : 3</h3><p>Classic shortbread is <b>1</b> part sugar, <b>2</b> parts butter and <b>3</b> parts flour. Change the flour and watch the others follow.</p>
    <label class="f" for="m-flour">Flour (g)<input type="number" min="0" max="5000" id="m-flour" data-m="flour" value="${fl}"></label>

    <div class="row"><label class="f" for="m-dough">Flour (g)<input type="number" min="1" id="m-dough" data-m="dough" value="${MATH.dough}"></label><label class="f" for="m-water">Water (g)<input type="number" min="0" id="m-water" data-m="water" value="${MATH.water}"></label></div>

  </div>
  <div class="card mathcard wide"><div class="weeknav"><h3>7. Cost, price and profit</h3><button class="btn small" data-a="costreset">Reset to example</button></div>
    <p>This is exactly how real bakeries set their prices. The example is 12 fairy cakes. <b>The prices are only examples, so check your own shop.</b></p>

function newDraft(pre){jDraft=Object.assign({date:dkey(TODAY),name:"",helper:"Mum",mood:"proud",stars:5,fav:"",next:"",photos:[],audio:[]},pre||{});}

async function startRec(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){toast("Voice notes don't work here. Try the latest Chrome, Edge, Firefox or Safari.");return;}
  readDraft();
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mr=new MediaRecorder(stream);const chunks=[];
    mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
    mr.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());clearInterval(recTick);const blob=new Blob(chunks,{type:mr.mimeType||"audio/webm"});const id="a"+Date.now().toString(36);try{await mPut(id,blob);if(jDraft)jDraft.audio.push(id);toast("Voice note saved!");}catch(e){toast("Couldn't save the voice note on this device.");}REC=null;readDraft();render();};
    mr.start();REC={mr,t0:Date.now()};render();
    recTick=setInterval(()=>{if(!REC)return;const s=Math.floor((Date.now()-REC.t0)/1000);const el=document.getElementById("rec-time");if(el)el.textContent=`${Math.floor(s/60)}:${pad(s%60)}`;if(s>=180)stopRec();},500);
  }catch(e){toast("The microphone isn't available. A grown-up may need to allow it in the browser settings.");}
}
function stopRec(){if(REC&&REC.mr.state!=="inactive")REC.mr.stop();}
function dictate(target){
  if(DICT){const was=DICT.target;DICT.rec.stop();DICT=null;render();if(was===target)return;}
  if(!SR){toast("Voice typing isn't available in this browser. Try the microphone key on your device's keyboard instead.");return;}
  readDraft();
  if(!state.voiceOK){voiceAsk=target;render();return;}
  const rec=new SR();rec.lang="en-GB";rec.interimResults=true;rec.continuous=true;
  const el=document.getElementById(target);if(!el)return;
  const start=el.value?el.value.replace(/\s*$/," "):"";let finalTxt="";
  rec.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i];if(res.isFinal)finalTxt+=res[0].transcript;else interim+=res[0].transcript;}const box=document.getElementById(target);if(box)box.value=(start+finalTxt+interim).slice(0,500);readDraft();};
  rec.onerror=ev=>{toast(ev.error==="not-allowed"||ev.error==="service-not-allowed"?"The microphone isn't allowed. A grown-up can allow it in the browser settings.":"Voice typing stopped. Press Speak to try again.");};

  try{rec.start();DICT={rec,target};render();}catch(e){toast("Voice typing couldn't start. Try again.");}
}
async function backup(){
  try{
    const media={};
    for(const j of state.journal)for(const id of [...(j.photos||[]),...(j.audio||[])]){const b=await mGet(id).catch(()=>null);if(b)media[id]=await blobToDataURL(b);}
    const blob=new Blob([JSON.stringify({app:"whisk-and-wonder",v:2,saved:new Date().toISOString(),state,media})],{type:"application/json"});
    const fname=`whisk-and-wonder-backup-${dkey(new Date())}.json`;
    
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},3000);

}
async function restore(){

function chime(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach((d,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="triangle";o.frequency.value=[784,988,1319][i];g.gain.setValueAtTime(.0001,audioCtx.currentTime+d);g.gain.exponentialRampToValueAtTime(.3,audioCtx.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d+.4);o.connect(g).connect(audioCtx.destination);o.start(audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d+.45);});}catch(e){}}
